{% extends "base.html" %}
{% block content %}

<div class="container-fluid">
  <div class="row show-grid">
    <span class="col-md-12">
      <strong>건강도</strong>
    </span>
  </div>
  <div id="health_progress_wrap" style="display:none; margin:2px 0 10px 0">
    <div style="height:8px; background:#edf2f7; border-radius:4px; overflow:hidden"><div id="health_progress_bar" style="height:100%; width:0%; background:#3182ce; transition:width .4s ease"></div></div>
    <div id="health_progress_text" style="font-size:12px; color:#888; margin-top:3px">불러오는 중… 0%</div>
  </div>
  <div class="row show-grid">
    <span class="col-md-12">
      <span style="float:right; display:flex; align-items:center; gap:6px; white-space:nowrap">
        <label style="font-weight:normal; font-size:12.5px; margin:0"><input type="checkbox" id="refreshUseCheck"{% if (arg['status_auto_refresh_min'] or '30') != '0' %} checked{% endif %}> 자동 업데이트</label>
        <span id="refreshMinWrap"{% if (arg['status_auto_refresh_min'] or '30') == '0' %} style="display:none"{% endif %}>
          <label style="font-weight:normal; font-size:12.5px; margin:0">주기
            <input type="number" id="refreshMinInput" min="1" max="120" value="{{ '30' if (arg['status_auto_refresh_min'] or '30') == '0' else arg['status_auto_refresh_min'] }}" style="width:52px; height:26px; display:inline-block; padding:2px 6px; font-size:12.5px" class="form-control"> 분
          </label>
        </span>
        <button type="button" class="btn btn-primary" id="refreshSaveBtn" style="padding:2px 10px; font-size:12.5px">저장</button>
        <button type="button" class="btn btn-info" id="statusRefreshBtn" style="padding:2px 10px; font-size:12.5px">새로고침</button>
      </span>
    </span>
  </div>
  <div class="row show-grid">
    <span class="col-md-12" style="font-size:12px; color:#aaa; text-align:right">
      주기는 1~120분으로 저장할 수 있습니다.
    </span>
  </div>
</div>
<style>
.sm-health-libs { display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; }
@media (max-width: 1400px) { .sm-health-libs { grid-template-columns:repeat(3, 1fr); } }
@media (max-width: 1050px) { .sm-health-libs { grid-template-columns:repeat(2, 1fr); } }
@media (max-width: 620px) { .sm-health-libs { grid-template-columns:1fr; } }
.sm-donut-row { display:grid; gap:10px; }
.sm-donut-row.cols-2 { grid-template-columns:repeat(2, 1fr); }
.sm-donut-row.cols-3 { grid-template-columns:repeat(3, 1fr); }
.sm-donut-row.cols-4 { grid-template-columns:repeat(4, 1fr); }
@media (max-width: 1050px) { .sm-donut-row.cols-3, .sm-donut-row.cols-4 { grid-template-columns:repeat(2, 1fr); } }
@media (max-width: 600px) { .sm-donut-row.cols-2, .sm-donut-row.cols-3, .sm-donut-row.cols-4 { grid-template-columns:1fr; } }
</style>
<div id="health_head_div" style="margin-bottom:6px; display:none"><strong><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#4a5568" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px; margin-right:6px"><g transform="translate(0 1.92) scale(1 0.84)"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></g></svg>라이브러리 건강도</strong> <span style="font-size:12px; color:#888">데이터베이스 기준</span></div>
<div id="health_div" style="margin-bottom:16px; display:none"></div>
<div id="health_msg_div" style="padding:24px 4px; color:#888">건강도 정보를 불러오는 중입니다. 잠시만 기다려 주세요.</div>

<script type="text/javascript">
var API_BASE = '/' + location.pathname.split('/')[1] + '/ajax/status/';
var refreshTimer = null;
var currentRefreshMin = null;

function fmtNum(n) {
  if (n === null || n === undefined) return '-';
  return Number(n).toLocaleString();
}

function setupTimer(min) {
  if (refreshTimer) { clearInterval(refreshTimer); refreshTimer = null; }
  currentRefreshMin = min;
  if (min > 0) refreshTimer = setInterval(load_health, min * 60000);
}

function applyRefreshUI(min) {
  if (min == 0) {
    $('#refreshUseCheck').prop('checked', false);
    $('#refreshMinWrap').hide();
  } else {
    $('#refreshUseCheck').prop('checked', true);
    $('#refreshMinWrap').show();
    $('#refreshMinInput').val(min);
  }
}


// 아이콘은 프레임워크 폰트(FA 4.7)에 없는 모양이 있어 SVG를 직접 심는다 — stroke는 currentColor 대신 고정 회청색
function smIcon(name, color, size) {
  var P = {
    layers: '<path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/>',
    check: '<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>',
    alert: '<circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/>',
    list: '<path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/>',
    users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
    pie: '<path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/>',
    tag: '<path d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z"/><circle cx="7.5" cy="7.5" r=".5" fill="currentColor"/>',
    tasks: '<path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/><path d="M13 6h8M13 12h8M13 18h8"/>',
    film: '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 3v18M17 3v18M3 8h4M3 16h4M17 8h4M17 16h4"/>',
    tv: '<rect x="2" y="7" width="20" height="14" rx="2"/><path d="m17 2-5 5-5-5"/>',
    music: '<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',
    book: '<path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/>',
    image: '<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.09-3.09a2 2 0 0 0-2.82 0L6 21"/>',
    listSq: '<path d="M11 6h10M11 12h10M11 18h10"/><rect x="3" y="4" width="4" height="4"/><rect x="3" y="10" width="4" height="4"/><rect x="3" y="16" width="4" height="4"/>'
  };
  var sz = size || 15;
  var inner = (name == 'check' || name == 'alert') ? (P[name] || '') : '<g transform="translate(0 1.92) scale(1 0.84)">' + (P[name] || '') + '</g>';
  return '<svg width="' + sz + '" height="' + sz + '" viewBox="0 0 24 24" fill="none" stroke="' + (color || '#4a5568') + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px; margin-right:6px">' + inner + '</svg>';
}
var KIND_ICONS = {'movie': 'film', 'tv': 'tv', 'show': 'tv', 'music': 'music', 'book': 'book', 'photo': 'image'};

function healthCard(label, valueHtml, sub, iconName, iconColor) {
  return '<div style="flex:1 1 150px; border:1px solid #ddd; border-radius:6px; padding:10px 14px; background:#fff">'
    + '<div style="font-size:12px; color:#888">' + (iconName ? smIcon(iconName, iconColor, 13) : '') + label + '</div>'
    + '<div style="font-size:22px; font-weight:bold; margin:2px 0">' + valueHtml + '</div>'
    + (sub ? '<div style="font-size:12px; color:#888">' + sub + '</div>' : '')
    + '</div>';
}

function pctText(count, pct) {
  // 개수가 있는데 비율이 0%로 반올림되면 <1%로 표시한다
  if (count > 0 && !(pct > 0)) return '<1%';
  return (pct != null ? pct : 0) + '%';
}

function libComment(c) {
  // 수치로 한 줄 설명을 만든다
  var ml = c.main_label || '앨범';
  var mainCount = (c.main_count != null) ? c.main_count : c.albums;
  if (c.is_folder && mainCount > 0) {
    if (!(c.no_thumb > 0)) return '라이브러리 특성상 코드가 없어, 표지 여부로 건강도를 판단합니다. 모든 ' + ml + '에 표지가 있습니다.';
    return '라이브러리 특성상 코드가 없어, 표지 여부로 건강도를 판단합니다. 표지 없는 ' + ml + ' ' + fmtNum(c.no_thumb) + '개(' + pctText(c.no_thumb, c.check_pct) + ')은 점검이 필요합니다.';
  }
  if (mainCount > 0 && c.no_code >= mainCount) return ml + ' 전부에 코드가 없습니다.' + (c.lib_type == 'music' ? ' 차트 라이브러리 특성으로 보입니다.' : '');
  var miss = [['코드 없음', c.no_code], ['소개 없음', c.no_summary], ['연도 없음', c.no_year], ['표지 없음', c.no_thumb]];
  miss.sort(function(a, b){ return b[1] - a[1]; });
  if (miss[0][1] == 0) return '누락 항목이 없습니다.';
  var msg = '누락 중에서는 ' + miss[0][0] + '이 ' + fmtNum(miss[0][1]) + '개로 가장 많습니다.';
  if (c.no_code > 0) msg += ' 코드 없는 ' + ml + ' ' + fmtNum(c.no_code) + '개(' + pctText(c.no_code, (c.code_pct != null ? c.code_pct : c.check_pct)) + ')는 점검이 필요합니다.';
  else msg += (c.lib_type == 'music' || !c.lib_type) ? ' 코드 없는 앨범은 없습니다.' : ' 코드 없는 항목은 없습니다.';
  return msg;
}

var KIND_LABELS = {'music': '음악', 'movie': '영화', 'tv': '쇼', 'show': '쇼', 'book': '도서', 'photo': '사진'};

function statCell(label, valueHtml, extraHtml, valueStyle, plain) {
  // 상세 카드의 라벨+수치 한 쌍 — 셀 안에서 라벨은 왼쪽, 수치는 오른쪽에 붙는 방식을 모든 쌍이 똑같이 쓴다
  // 값이 0인 수치는 굵게 하지 않고 보통 굵기로 표시한다 (색상은 그대로, 0이 아닌 수치만 도드라지게)
  // plain이면 값이 0이 아니어도 굵게 하지 않는다 — 색으로 이미 표현한 수치(누락 구성 등)에 쓴다
  var isZero = String(valueHtml).replace(/,/g, '') === '0';
  var valStyle = 'margin-left:auto; white-space:nowrap' + (valueStyle ? '; ' + valueStyle : '');
  var valHtml = (isZero || plain)
    ? '<span style="' + valStyle + '">' + valueHtml + '</span>'
    : '<strong style="' + valStyle + '">' + valueHtml + '</strong>';
  return '<div style="display:flex; align-items:baseline; gap:5px; min-width:0">'
    + '<span style="white-space:nowrap">' + label + '</span>'
    + (extraHtml || '')
    + valHtml + '</div>';
}
function statGrid(cells, rows) {
  // 라벨+수치 쌍들을 2열 고정 그리드에 채워 옆·위아래 열이 가지런히 맞게 한다
  // rows를 주면 그 행 수만큼 구역 높이를 고정한다 — 종류마다 셀 수가 달라 행 수가 적은 카드에서
  // 아래 구역이 위로 당겨져 옆 카드와 가로 줄이 어긋나는 것을 막기 위함 (한 행 = line-height 1.55em, 행 간격 2px)
  var minH = rows ? ' min-height:calc(' + (1.55 * rows) + 'em + ' + (2 * (rows - 1)) + 'px);' : '';
  return '<div style="display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:2px 18px; font-size:12.5px; line-height:1.55;' + minH + '">' + cells.join('') + '</div>';
}

function libCard(c) {
  var ml = c.main_label || '앨범';
  var sl = c.sub_label || '트랙';
  var mainCount = (c.main_count != null) ? c.main_count : c.albums;
  var subCount = (c.sub_count != null) ? c.sub_count : c.tracks;
  var isEmpty = !(mainCount > 0);
  // 헤더는 한 줄 높이를 고정한다 — 제목이 길어 두 줄이 되면 그 아래 구역 전체가 밀려 카드마다 라인이 어긋나므로 제목은 한 줄로 유지한다
  var card = '<div style="display:flex; justify-content:space-between; align-items:baseline; min-height:22px">';
  card += '<span>' + (KIND_ICONS[c.lib_type] ? smIcon(KIND_ICONS[c.lib_type], null, 16) : '') + (KIND_LABELS[c.lib_type] ? '<span style="display:inline-block; background:#edf2f7; color:#4a5568; border-radius:8px; padding:1px 8px; font-size:11px; margin-right:6px; vertical-align:middle">' + KIND_LABELS[c.lib_type] + '</span>' : '') + '<strong style="font-size:15px; white-space:nowrap">' + c.title + '</strong></span>';
  if (isEmpty) card += '<span style="font-size:12px; color:#888"><strong style="color:#dd6b20; font-size:13px">비어있음</strong></span></div>';
  else card += '<span style="font-size:12px; color:#888">정상 <strong style="color:#38a169">' + pctText(c.ok || 0, c.ok_pct) + '</strong></span></div>';
  if (isEmpty) card += '<div style="height:8px; border-radius:4px; background:#edf2f7; margin:4px 0 6px 0"></div>';
  else card += '<div style="display:flex; height:8px; border-radius:4px; overflow:hidden; background:#dd6b20; margin:4px 0 6px 0"><div style="width:' + c.ok_pct + '%; background:#38a169"></div></div>';
  var mainCell = statCell(ml, fmtNum(mainCount));
  var subCell = statCell(sl, fmtNum(subCount));
  var groupCell = '';
  if (c.group_label) {
    var groupCount = (c.group_count != null) ? c.group_count : c.artists;
    groupCell = statCell(c.group_label, fmtNum(groupCount));
  }
  var cells = [];
  if (c.lib_type == 'music' && groupCell) cells = [groupCell, mainCell, subCell];
  else { cells = [mainCell, subCell]; if (groupCell) cells.push(groupCell); }
  if (c.file_count != null) cells.push(statCell('파일', fmtNum(c.file_count)));
  // 구성 구역은 종류마다 셀 수가 달라(영화는 2개, 쇼·음악은 4개) 행 수가 1~2행으로 갈린다 — 가장 많은 2행으로 높이를 고정해
  // 행이 적은 종류는 구역 안에서 위에 붙고 아래가 비게 하고, 그 아래 구역들의 시작 라인을 모든 카드에서 같게 맞춘다
  card += statGrid(cells, 2);
  card += '<div style="border-top:1px solid #eee; margin-top:4px; padding-top:4px">'
    + statGrid([statCell('정상 ' + ml, fmtNum(c.ok), null, 'color:#2f855a'),
                statCell('점검 필요', fmtNum(c.judge_missing != null ? c.judge_missing : (c.missing_any != null ? c.missing_any : c.no_code)), null, 'color:#c05621')], 1)
    + '</div>';
  // 점검 필요를 이루는 누락 숫자는 점검 필요와 같은 색으로 칠해 출처가 바로 보이게 한다.
  // 폴더 에이전트 카드는 표지 여부로만 판단하므로 표지 없음만 칠한다.
  // 색으로 이미 표현하므로 굵게는 하지 않는다 (plain).
  var missStyle = function(v, judged) { return (judged && v > 0) ? 'color:#c05621' : null; };
  var folderLib = !!c.is_folder;
  card += '<div style="border-top:1px solid #eee; margin-top:4px; padding-top:4px">'
    + statGrid([statCell('코드 없음', fmtNum(c.no_code), null, missStyle(c.no_code, !folderLib), true),
                statCell('소개 없음', fmtNum(c.no_summary), null, missStyle(c.no_summary, !folderLib), true),
                statCell('연도 없음', fmtNum(c.no_year), null, missStyle(c.no_year, !folderLib), true),
                statCell('표지 없음', fmtNum(c.no_thumb), null, missStyle(c.no_thumb, true), true)], 2)
    + '</div>';
  card += '<div style="border-top:1px solid #eee; margin-top:4px; padding-top:4px">'
    + statGrid([statCell('휴지통', c.trash != null ? fmtNum(c.trash) : '-', null, 'color:#dc3545')], 1)
    + '</div>';
  // 코멘트는 margin-top:auto로 카드 하단에 고정하고, 블록 높이를 3줄 분량으로 통일해 첫 줄 시작 위치를 카드마다 맞춘다
  if (isEmpty) card += '<div style="border-top:1px solid #eee; margin-top:auto; padding-top:4px; font-size:12.5px; line-height:1.5; min-height:4.5em; color:#dd6b20; font-weight:bold">라이브러리가 비어있습니다.</div>';
  else card += '<div style="border-top:1px solid #eee; margin-top:auto; padding-top:4px; font-size:12.5px; line-height:1.5; min-height:4.5em; color:#666">' + libComment(c) + '</div>';
  // 카드 내부는 세로 flex — 정보 행은 위에 붙고 코멘트만 하단으로 내려가 한 행의 카드 높이가 같아진다
  return '<div style="border:1px solid #ddd; border-radius:6px; padding:8px 10px; background:#fff; display:flex; flex-direction:column; height:100%">' + card + '</div>';
}

function donutSvg(segs, track, size) {
  var svg = '<svg width="' + size + '" height="' + size + '" viewBox="0 0 140 140">';
  svg += '<circle cx="70" cy="70" r="58" fill="none" stroke="' + (track || '#f1f1f1') + '" stroke-width="16"></circle>';
  var start = 0;
  for (var i = 0; i < segs.length; i++) {
    var p = segs[i].pct;
    if (p > 0) {
      var len = p;
      if (segs.length > 1 && p > 1.2) len = p - 0.8;
      svg += '<circle cx="70" cy="70" r="58" fill="none" stroke="' + segs[i].color + '" stroke-width="16" pathLength="100" stroke-dasharray="' + len + ' 100" stroke-dashoffset="' + (-start) + '" transform="rotate(-90 70 70)"></circle>';
    }
    start += p;
  }
  return svg + '</svg>';
}

var DONUT_SIZE = 140;
function legendItem(color, label, valueHtml) {
  // 범례 항목 하나 — 한 항목이 정확히 한 줄이다. 색 점·항목명은 왼쪽, 수치는 오른쪽 끝에 고정한다.
  // 예전 2열 흐름에서는 수치 길이에 따라 어떤 항목은 한 줄, 어떤 항목은 두 줄이 돼 열·행이 어긋났다 (2026-11-11).
  return '<span style="display:flex; align-items:baseline; gap:5px; min-width:0">'
    + '<span style="white-space:nowrap; word-break:keep-all"><span style="color:' + color + '">●</span> ' + label + '</span>'
    + '<span style="margin-left:auto; text-align:right; white-space:nowrap">' + valueHtml + '</span></span>';
}
function stackBar(segs) {
  // 가로 누적 막대 하나 — 상태별 구간을 너비 %로 이어 붙여 100%로 표시한다.
  // 구간이 0%인 상태는 너비 0이라 자연히 사라지고, 전체가 0개면 빈 막대 껍데기만 남는다.
  var s = '<div style="display:flex; width:100%; height:20px; background:#f1f1f1; border-radius:5px; overflow:hidden">';
  for (var i = 0; i < segs.length; i++) {
    if (segs[i].pct > 0) s += '<div style="width:' + segs[i].pct + '%; background:' + segs[i].color + '; height:100%"></div>';
  }
  return s + '</div>';
}
function barCard(title, segs, rightHtml, legendHtml, iconName) {
  var s = '<div style="border:1px solid #ddd; border-radius:6px; padding:10px 12px; background:#fff; display:flex; flex-direction:column">';
  s += '<div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px">'
    + '<span style="font-size:13px; font-weight:bold">' + (iconName ? smIcon(iconName, null, 14) : '') + title + '</span>'
    + '<span style="font-size:12.5px; color:#555">' + rightHtml + '</span></div>';

function donutCard(title, segs, track, centerMain, centerSub, legendHtml, iconName) {
  var s = '<div style="border:1px solid #ddd; border-radius:6px; padding:10px 12px; background:#fff; display:flex; flex-direction:column">';

  s += '<div style="flex:1; display:flex; flex-direction:column; justify-content:center">';
  s += '<div style="position:relative; width:' + DONUT_SIZE + 'px; height:' + DONUT_SIZE + 'px; margin:0 auto">' + donutSvg(segs, track, DONUT_SIZE)
    + '<div style="position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center">'
    + '<div style="font-size:19px; font-weight:bold">' + centerMain + '</div>'
    + '<div style="font-size:11px; color:#888">' + centerSub + '</div></div></div>';

function libJudgeCount(c) { return c.judge_missing != null ? c.judge_missing : (c.missing_any != null ? c.missing_any : (c.no_code || 0)); }
function libMainCount(c) { return c.main_count != null ? c.main_count : (c.albums || 0); }
function libSortOption(v, label) { return '<option value="' + v + '"' + (healthLibSort == v ? ' selected' : '') + '>' + label + '</option>'; }
function sortedHealthLibs() {
  // 라이브러리별 상세 정렬 — 서버에 다시 묻지 않고 받은 데이터 안에서만 즉시 재정렬한다
  var libs = (lastHealthLibs || []).slice();
  if (healthLibSort == 'name') libs.sort(function(a, b) { return String(a.title || '').localeCompare(String(b.title || ''), 'ko'); });
  else if (healthLibSort == 'check') libs.sort(function(a, b) { return libJudgeCount(b) - libJudgeCount(a); });
  else if (healthLibSort == 'okpct') libs.sort(function(a, b) { return (a.ok_pct || 0) - (b.ok_pct || 0); });
  else if (healthLibSort == 'media') libs.sort(function(a, b) { return libMainCount(b) - libMainCount(a); });

}

var healthPollCount = 0;
var healthGuideOpen = false;
function toggleHealthGuide() {

var healthLoadStartAt = null;
function fmtHealthElapsed(ms) {
  var s = ms / 1000;
  if (s < 60) return s.toFixed(1) + '초';
  return Math.floor(s / 60) + '분 ' + Math.round(s % 60) + '초';
}
var healthProgressValue = 0;
var healthProgressTimer = null;
var healthDoneOnce = false;
// 단계 표시는 서버가 보고한 진행률(healthStepValue) 기준이다
var healthStepValue = 0;
function statusStepText(p) {
  if (p < 15) return '휴지통 개수 읽는 중';
  if (p < 80) return '라이브러리 정보 읽는 중';
  if (p < 90) return '전체 통계 묶는 중';
  return '결과 저장 중';
}
function paintHealthProgress() {
  $('#health_progress_wrap').show();
  $('#health_progress_bar').css('width', healthProgressValue + '%');
  $('#health_progress_text').text(statusStepText(healthStepValue) + '… ' + healthProgressValue + '%');
}
function startHealthCreep(cap) {
  if (healthProgressTimer) clearInterval(healthProgressTimer);
  healthProgressTimer = setInterval(function () {
    if (healthProgressValue < cap) {
      healthProgressValue = Math.min(cap, healthProgressValue + Math.max(1, Math.round((cap - healthProgressValue) * 0.07)));
      paintHealthProgress();
    }
  }, 250);
}
function stopHealthCreep() {
  if (healthProgressTimer) { clearInterval(healthProgressTimer); healthProgressTimer = null; }
}
function setHealthProgress(p) {
  if (p === null || p === undefined) return;
  healthStepValue = p;
  if (p > healthProgressValue) { healthProgressValue = p; paintHealthProgress(); }
  else paintHealthProgress();
}
function finishHealthProgress(ret) {
  stopHealthCreep();
  healthProgressValue = 100;
  $('#health_progress_wrap').show();
  $('#health_progress_bar').css('width', '100%');
  var el = healthLoadStartAt ? fmtHealthElapsed(Date.now() - healthLoadStartAt) : '';
  var txt = '불러오기 완료' + (el ? ' · 소요시간 ' + el : '');
  if (ret && ret.from_cache) txt += ' · ' + (ret.cached_at || '') + ' 기준';
  $('#health_progress_text').text(txt);
  healthDoneOnce = true;
}

function load_health(force) {
  if (!healthPollCount) healthLoadStartAt = Date.now();
  if ((force || !healthDoneOnce) && !healthProgressTimer) { healthProgressValue = 0; healthStepValue = 0; paintHealthProgress(); startHealthCreep(40); }
  $.ajax({
    global: false,
    type: 'POST',
    url: API_BASE + 'list',
    data: force ? {force: '1'} : {},
    timeout: 120000,
    success: function (ret) {
      if (ret.ret != 'success') { stopHealthCreep(); $('#health_progress_wrap').hide(); $('#health_msg_div').show().text('건강도 정보를 불러오지 못했습니다.'); return; }
      if (ret.need_config) { stopHealthCreep(); $('#health_progress_wrap').hide(); $('#health_msg_div').show().text('건강도를 보기 위해 설정에서 정보를 입력해 주세요.'); return; }
      if (ret.db_loading && !ret.health) {
        $('#health_msg_div').show().text('건강도 정보를 불러오는 중입니다. 잠시만 기다려 주세요.');
        setHealthProgress(ret.progress);
        startHealthCreep(95);
        if (healthPollCount < 50) { healthPollCount++; setTimeout(load_health, 3000); }
        return;
      }
      healthPollCount = 0;
      if (!ret.health) { stopHealthCreep(); $('#health_progress_wrap').hide(); $('#health_msg_div').show().text('Relay에서 연결 테스트를 통과하면 데이터베이스 기준 건강도를 보여 드립니다.'); return; }
      finishHealthProgress(ret);
      $('#health_msg_div').hide();
      renderHealth(ret.health);
      if (ret.refresh_min !== undefined && ret.refresh_min !== currentRefreshMin) {
        applyRefreshUI(ret.refresh_min);
        setupTimer(ret.refresh_min);
      }
    },
    error: function () {
      $('#health_msg_div').show().text('건강도 정보를 불러오지 못했습니다.');
    }
  });
}

$(document).ready(function() {
  $('#statusRefreshBtn').on('click', function(){ load_health(true); });
  $('#refreshUseCheck').on('change', function(){
    $('#refreshMinWrap').toggle(this.checked);
  });
  $('#refreshSaveBtn').on('click', function(){
    var use = $('#refreshUseCheck').is(':checked');
    var min = parseInt($('#refreshMinInput').val(), 10);
    if (use && !(min >= 1 && min <= 120)) { alert('주기는 1~120분으로 입력해 주세요.'); return; }
    $.ajax({
      global: false,
      type: 'POST',
      url: API_BASE + 'set_refresh',
      data: {min: use ? min : 0},
      success: function (ret) {
        if (window.notify) notify(ret.msg, ret.ret == 'success' ? 'success' : 'error');
        else alert(ret.msg);
        if (ret.ret == 'success') {
          currentRefreshMin = use ? min : 0;
          applyRefreshUI(currentRefreshMin);
          setupTimer(currentRefreshMin);
        }
      },
      error: function () { alert('저장에 실패했습니다. 잠시 후 다시 시도해 주세요.'); }
    });
  });
  var initMin = parseInt("{{ arg['status_auto_refresh_min'] or '30' }}", 10);
  if (isNaN(initMin)) initMin = 1;
  currentRefreshMin = initMin;
  load_health();
  setupTimer(initMin);
});
</script>
{% endblock %}
