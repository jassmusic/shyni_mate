{% extends "base.html" %}
{% block content %}

<style>
/* 결과 목록 표 — Plex Mate식 간결 표 + 폰 고정 폭 */
/* 본문 색상은 명시한다 — 상위 div가 #888이라 안 하면 회색으로 보인다 */
.hist-table { width:100%; border-collapse:collapse; table-layout:fixed; font-size:14px; color:#212529; }
.hist-table th, .hist-table td { padding:5px 4px; border-top:1px solid #dee2e6; vertical-align:top; }
.hist-table thead th { background:none; color:#212529; border:none; border-top:2px solid #dee2e6; border-bottom:2px solid #dee2e6; font-size:14px; font-weight:bold; }
.hist-table .c-time { text-align:center; }
.hist-table .c-name { text-align:left; word-break:keep-all; overflow-wrap:break-word; }
.hist-table .c-status { text-align:center; }
.hist-table .c-num { text-align:right; }
.hist-table .c-num .missing { display:block; font-size:13px; color:#dc3545; }
</style>

<div id="trash_current_div" style="border:1px solid #ddd; border-radius:6px; padding:12px 14px; margin:10px 0; background:#f9f9f9">
  진행 상태를 불러오는 중입니다.
</div>

<div style="display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin:10px 0">
  <select id="histLibSel" class="form-control input-sm" style="flex:1 1 130px">
    <option value="">전체 라이브러리</option>
  </select>
  <label style="font-weight:normal; margin:0"><input type="checkbox" id="histOnlyAppend" name="tmp_hist_only_append"> 추가된 항목만</label>
  <input type="text" id="histSearch" class="form-control input-sm" placeholder="작업명·라이브러리·파일 경로 검색" style="flex:1 1 160px">
  <button type="button" class="btn btn-sm btn-default" id="histSearchBtn">검색</button>
  <button type="button" class="btn btn-sm btn-default" id="histResetBtn">초기화</button>
  <span style="margin-left:auto">
    <button type="button" class="btn btn-sm btn-default" id="histRefreshBtn">새로고침</button>
    <button type="button" class="btn btn-sm btn-default" id="histExpandAllBtn">모두 펼치기</button>
    <button type="button" class="btn btn-sm btn-default" id="histCollapseAllBtn">모두 접기</button>
  </span>
</div>

<div id="trash_history_div" style="font-size:13px; color:#888">불러오는 중입니다.</div>

<script type="text/javascript">
var LIBS = [];
var API_BASE = '/' + location.pathname.split('/')[1] + '/ajax/trash/';

function esc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
}

// 통계 칸 표시 — 예전 행의 NULL은 '-'로 표시한다
function statText(v) {
  if (v == null) return '-';
  return String(v);
}

// 목록 시각은 분까지만 — 초까지 있으면 열이 넓어져 작업명·라이브러리가 쪼그라든다.
// 서버는 %m-%d %H:%M:%S (14자)로 주므로 앞 11자가 MM-DD HH:MM이다.
function fmtTimeShort(t) {
  if (t == null) return '';
  return String(t).substring(0, 11);
}

function fmtDur(sec) {
  if (sec == null) return '-';
  sec = parseInt(sec, 10);
  if (isNaN(sec) || sec < 0) return '-';
  if (sec < 60) return sec + '초';
  // 분·초 단위 사이에서만 꺾이게 — '2분 37초'가 '2분'/'37초'로 나뉜다.
  return '<span style="white-space:nowrap">' + Math.floor(sec / 60) + '분</span> <span style="white-space:nowrap">' + (sec % 60) + '초</span>';
}

// 대기 시간 표시 — 45초 · 12분 3초 · 6시간 5분
function fmtWait(sec) {
  if (sec == null) return '-';
  sec = parseInt(sec, 10);
  if (isNaN(sec) || sec < 0) sec = 0;
  if (sec < 60) return sec + '초';
  if (sec < 3600) {
    var m = Math.floor(sec / 60);
    var s = sec % 60;
    return s ? m + '분 ' + s + '초' : m + '분';
  }
  var h = Math.floor(sec / 3600);
  var mm = Math.floor((sec % 3600) / 60);
  return mm ? h + '시간 ' + mm + '분' : h + '시간';
}

// 소요 칸 — 대기 중이면 대기 경과, 실행 중이면 기다린 시간, 끝나면 전체 소요
function durCell(h) {
  if (h.status == 'waiting') return '대기 ' + fmtDur(h.waiting_seconds);
  if (h.status == 'running' && h.wait_seconds != null) return '대기 ' + fmtDur(h.wait_seconds);
  return fmtDur(h.duration);
}

function stageLabel(stage) {
  if (stage == 'refresh') return '새로고침 중';
  if (stage == 'scan') return '스캔 중';
  if (stage == 'empty') return '비우는 중';
  return stage || '';
}

function renderCurrent(cur) {
  if (!cur) {
    $('#trash_current_div').html('<span style="color:#888">현재 진행 중인 휴지통 작업이 없습니다.</span>');
    return;
  }
  var str = '<div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:6px">';
  str += '<div style="font-size:14px">🔄 <strong>진행 중</strong> — ' + esc(cur.job_name) + ' · ' + esc(cur.section_title) + ' <strong>' + stageLabel(cur.stage) + '</strong>';
  str += '<div style="font-size:12px; color:#888; margin-top:2px">작업 시작 ' + esc(cur.job_started_at) + ' · 이 라이브러리 시작 ' + esc(cur.section_started_at) + (cur.mode == 'manual' ? ' · 수동 실행' : ' · 스케줄 실행') + '</div></div>';
  str += '<button type="button" class="btn btn-sm btn-danger" id="trashCancelBtn">취소</button>';
  str += '</div>';
  $('#trash_current_div').html(str);
}

function loadCurrent() {
  $.ajax({
    type: 'POST', url: API_BASE + 'current', data: {}, global: false,
    success: function (ret) { if (ret.ret == 'success') renderCurrent(ret.data); }
  });
}

function statusText(s) {
  if (s == 'done') return '<span style="color:#2f855a">완료</span>';
  if (s == 'failed') return '<span style="color:#c0392b">실패</span>';
  if (s == 'cancelled') return '<span style="color:#b7791f">취소</span>';
  if (s == 'running') return '<span style="color:#2b6cb0">실행 중</span>';
  if (s == 'waiting') return '<span style="color:#6b46c1">대기 중</span>';
  if (s == 'terminated') return '<span style="color:#888">중단됨(재시작)</span>';
  return s;
}

var histPage = 1;
var expandedIds = {};
var detailCache = {};

function renderHistory(data) {
  if (!data || !data.count) {
    $('#trash_history_div').html('아직 실행 이력이 없습니다.');
    return;
  }
  histPage = data.page;
  var rows = data.list || [];
  var str = '<table class="hist-table"><colgroup><col style="width:11%"><col style="width:11%"><col style="width:14%"><col style="width:18%"><col style="width:10%"><col style="width:10%"><col style="width:14%"><col style="width:12%"></colgroup><thead><tr><th class="c-time">시작</th><th class="c-time">종료</th><th class="c-name">작업명</th><th class="c-name">라이브러리</th><th class="c-status">상태</th><th class="c-num">소요</th><th class="c-num">전체</th><th class="c-num">비운</th></tr></thead><tbody>';
  for (var i = 0; i < rows.length; i++) {
    var h = rows[i];
    var expanded = !!expandedIds[h.id];
    str += '<tr class="hist-row" data-id="' + h.id + '" style="cursor:pointer' + (expanded ? '; background:#f7fafc' : '') + '">';
    str += '<td class="c-time">' + fmtTimeShort(h.start_time) + '</td>';
    str += '<td class="c-time">' + fmtTimeShort(h.finish_time) + '</td>';
    str += '<td class="c-name">' + esc(h.job_name) + (h.mode == 'manual' ? ' <span style="color:#6c757d; font-size:13px">(수동)</span>' : '') + '</td>';
    str += '<td class="c-name">' + esc(h.section_title) + '</td>';
    str += '<td class="c-status">' + statusText(h.status) + '</td>';
    str += '<td class="c-num">' + durCell(h) + '</td>';
    var totalCell = statText(h.stat_total);
    if (h.stat_total != null && h.total_label === '처리') totalCell = '처리 ' + statText(h.stat_total);
    str += '<td class="c-num">' + totalCell + (h.stat_missing != null && h.stat_missing > 0 ? '<span class="missing">누락 ' + h.stat_missing + '</span>' : '') + '</td>';
    str += '<td class="c-num">' + statText(h.emptied_count) + '</td></tr>';
    if (expanded) {
      str += '<tr class="hist-detail-row" data-id="' + h.id + '"><td colspan="8" style="background:#f7fafc"><div class="hist-detail" data-id="' + h.id + '">';
      str += detailCache[h.id] ? renderDetail(detailCache[h.id]) : '불러오는 중입니다.';
      str += '</div></td></tr>';
    }
  }
  str += '</tbody></table>';
  str += '<div style="display:flex; justify-content:space-between; align-items:center; margin-top:6px">';
  str += '<span style="color:#888">전체 ' + data.count + '개</span>';
  str += '<span><button type="button" class="btn btn-xs btn-default" id="histPrevBtn"' + (data.page <= 1 ? ' disabled' : '') + '>이전</button> ';
  str += data.page + ' / ' + data.pages + ' 페이지 ';
  str += '<button type="button" class="btn btn-xs btn-default" id="histNextBtn"' + (data.page >= data.pages ? ' disabled' : '') + '>다음</button></span></div>';
  $('#trash_history_div').html(str);
  $('#histPrevBtn').click(function () { loadHistory(histPage - 1); });
  $('#histNextBtn').click(function () { loadHistory(histPage + 1); });
}

function folderStatLine(f) {
  var folder = f.path || f.folder || f.dir || f.name || '';
  // shyni results 항목은 집계가 result 안에 중첩돼 있다 (쇼 job 47580 확인).
  // 평평한 구조(구버전)도 대비해 없으면 항목 자체에서 읽는다.
  var r = (f.result && typeof f.result === 'object') ? f.result : f;
  var bits = [];
  if (r.new != null && r.new > 0) bits.push('신규 ' + r.new);
  if (r.total != null) bits.push('전체 ' + r.total);
  if (r.missing != null && r.missing > 0) bits.push('누락 ' + r.missing);
  if (r.updated != null && r.updated > 0) bits.push('업데이트 ' + r.updated);
  if (r.restored != null && r.restored > 0) bits.push('복원 ' + r.restored);
  return esc(folder) + (bits.length ? ' — ' + bits.join(' · ') : '');
}

function renderDetail(d) {
  var str = '<div style="font-size:13px; line-height:1.8">';
  // 상세 첫 줄 — 목록에서 줄인 초 단위 시각·전체 작업명을 보완한다.
  // 끝난 시각은 같은 날이면 시:분:초만, 자정을 넘겼으면 날짜까지 보여준다.
  var headName = d.job_name ? esc(d.job_name) + (d.mode == 'manual' ? ' (수동)' : '') : '';
  var headTime = '';
  if (d.start_time) {
    headTime = esc(d.start_time);
    if (d.finish_time) {
      headTime += ' → ' + esc(d.finish_time.substring(0, 5) === d.start_time.substring(0, 5) ? d.finish_time.substring(6) : d.finish_time);
    } else {
      headTime += ' 시작';
    }
  }
  var head = '';
  if (headName) head += '<strong>' + headName + '</strong>';
  if (d.section_title) head += (head ? ' — ' : '') + esc(d.section_title);
  if (headTime) head += (head ? ' · ' : '') + '<span style="color:#888">' + headTime + '</span>';
  if (head) str += '<div style="font-size:13px; margin-bottom:2px">' + head + '</div>';
  // 단계별 소요 — 대기 중이면 대기 경과를 초 단위로 올리는 타이머,
  // 기다렸다 시작한 행은 대기 시간을 맨 앞에 붙인다.
  var steps = [];
  if (d.status == 'waiting') {
    steps.push('대기 <span class="wait-timer" data-secs="' + (d.waiting_seconds || 0) + '">' + fmtWait(d.waiting_seconds || 0) + '</span>');
  } else {
    if (d.wait_seconds != null) steps.push('대기 ' + fmtDur(d.wait_seconds));
    if (d.vfs_duration != null) steps.push('새로고침 ' + fmtDur(d.vfs_duration));
    if (d.scan_duration != null) steps.push('스캔 ' + fmtDur(d.scan_duration));
    steps.push('전체 ' + fmtDur(d.duration));
  }
  str += '<div><strong>소요</strong> — ' + steps.join(' · ') + '</div>';
  // 비운 개수
  if (d.emptied_count != null) str += '<div><strong>비운 개수</strong> — ' + d.emptied_count + '개</div>';
  // 작업 단위 행(대기 행·시작 실패 행)은 라이브러리별 결과가 없다 —
  // 집계·폴더·추가 파일 대신 아래 행을 보라는 안내만 보여준다.
  var isJobRow = !d.section_key;
  if (isJobRow) {
    str += '<div style="color:#888">라이브러리별 결과는 같은 작업명의 아래 행에서 확인해 주세요.</div>';
  } else {
  // 집계 한 줄 (0인 항목은 빼고 간결하게)
  var hasStats = d.stat_total != null || d.stat_new != null || d.stat_missing != null ||
    d.stat_updated != null || d.stat_restored != null || d.stat_registered != null || d.stat_failed != null;
  if (hasStats) {
    var bits = [];
    if (d.stat_total != null) bits.push((d.total_label || '전체') + ' ' + d.stat_total);
    if (d.stat_new != null && d.stat_new > 0) bits.push('신규 ' + d.stat_new);
    if (d.stat_updated != null && d.stat_updated > 0) bits.push('업데이트 ' + d.stat_updated);
    if (d.stat_restored != null && d.stat_restored > 0) bits.push('복원 ' + d.stat_restored);
    if (d.stat_missing != null && d.stat_missing > 0) bits.push('누락 ' + d.stat_missing);
    if (d.stat_registered != null && d.stat_registered > 0) bits.push('등록 ' + d.stat_registered);
    if (d.stat_failed != null && d.stat_failed > 0) bits.push('실패 ' + d.stat_failed);
    var aggTxt = bits.length ? bits.join(' · ') : '변화가 없습니다.';
    if (d.stat_missing != null && d.stat_missing > 0 && d.section_key) {
      aggTxt += ' · <a href="#" class="trash-goto" data-key="' + d.section_key + '">휴지통 보러가기</a>';
    }
    str += '<div><strong>집계</strong> — ' + aggTxt + '</div>';
  } else if (d.status == 'running') {
    str += '<div style="color:#888">작업이 끝나면 집계가 표시됩니다.</div>';
  } else {
    str += '<div style="color:#888">집계가 없습니다. (스캔 단계가 없거나, 이 실행은 결과 저장이 되기 전에 기록됐습니다.)</div>';
  }
  if (d.shyni_job_id) str += '<div style="color:#888">shyni 작업 번호 ' + esc(d.shyni_job_id) + '</div>';
  // 폴더별 결과
  var folders = d.stat_folders || [];
  if (folders.length) {
    str += '<div style="margin-top:6px"><strong>폴더별 결과</strong><ul style="margin:2px 0; padding-left:18px">';
    for (var i = 0; i < folders.length; i++) str += '<li>' + folderStatLine(folders[i]) + '</li>';
    str += '</ul></div>';
  }
  // 추가 파일 목록 — 앨범(폴더) 단위 묶음
  str += '<div style="margin-top:6px"><strong>추가된 파일</strong> ';
  // Relay가 꺼져 있으면 목록이 저장되지 않으니 실행 중에도 Relay 문구를 보여준다.
  if (d.status == 'running' && d.db_ready !== false) {
    str += '<span style="color:#888">작업이 끝나면 목록이 표시됩니다.</span>';
  } else if (d.append_total == null) {
    str += '<span style="color:#888">파일 목록을 볼 수 없습니다. Relay가 꺼져 있으면 목록은 저장되지 않습니다.</span>';
  } else if (!d.append_total) {
    str += '<span style="color:#888">없습니다.</span>';
  } else {
    str += '<span style="color:#888">전체 ' + d.append_count + '개' + (d.append_truncated ? ' (외 ' + (d.append_count - d.append_total) + '개 더 있음)' : '') + '</span>';
    var groups = d.append_groups || [];
    str += '<ul style="margin:2px 0; padding-left:18px">';
    for (var g = 0; g < groups.length; g++) {
      var grp = groups[g];
      str += '<li><a href="#" class="append-group-toggle" data-gidx="' + g + '" data-id="' + d.id + '">' + esc(grp.name) + ' (' + grp.count + '개)</a>';
      str += '<span style="color:#888; font-size:12px"> ' + esc(grp.folder) + '</span>';
      str += '<div class="append-group-files" data-gidx="' + g + '" data-id="' + d.id + '" style="display:none; padding-left:14px; color:#555">';
      for (var f = 0; f < grp.files.length; f++) str += '<div>' + esc(grp.files[f]) + '</div>';
      str += '</div></li>';
    }
    str += '</ul>';
  }
  str += '</div>';
  }
  if (d.message) str += '<div style="color:#888; margin-top:4px">' + esc(d.message) + '</div>';
  str += '</div>';
  return str;
}

function loadDetail(id) {
  // 실행 중·대기 중이던 상세는 끝나면 다시 읽어와야 최종 결과가 보인다.
  if (detailCache[id] && detailCache[id].status != 'running' && detailCache[id].status != 'waiting') return;
  $.ajax({
    type: 'POST', url: API_BASE + 'history_detail', data: {id: id}, global: false,
    success: function (ret) {
      if (ret.ret != 'success' || !ret.data) {
        $('.hist-detail[data-id="' + id + '"]').html('<span style="color:#c0392b">상세를 불러오지 못했습니다.</span>');
        return;
      }
      detailCache[id] = ret.data;
      $('.hist-detail[data-id="' + id + '"]').html(renderDetail(ret.data));
    },
    error: function () {
      $('.hist-detail[data-id="' + id + '"]').html('<span style="color:#c0392b">상세를 불러오지 못했습니다.</span>');
    }
  });
}

// 펼쳐 둔 행이 끝났는데 상세 캐시가 실행 중 상태면 다시 읽어온다 —
// 끝나고도 '끝나면 표시됩니다'가 남아 있으면 헷갈리기 때문이다.
function refreshStaleDetails(rows) {
  for (var i = 0; i < rows.length; i++) {
    var h = rows[i];
    if (expandedIds[h.id] && h.status != 'running' && h.status != 'waiting' &&
        detailCache[h.id] && (detailCache[h.id].status == 'running' || detailCache[h.id].status == 'waiting')) {
      loadDetail(h.id);
    }
  }
}

function loadHistory(page, cb) {
  if (page == null) page = histPage;
  $.ajax({
    type: 'POST', url: API_BASE + 'history', global: false,
    data: {
      page: page,
      section: $('#histLibSel').val() || '',
      only_append: $('#histOnlyAppend').is(':checked') ? '1' : '',
      search: $('#histSearch').val() || ''
    },
    success: function (ret) {
      if (ret.ret == 'success') {
        renderHistory(ret.data);
        refreshStaleDetails(ret.data.list || []);
      }
      if (cb) cb();
    }
  });
}

// 라이브러리 목록은 페이지가 뜬 뒤에 따로 불러온다 — 필터만 채우는
// 목록 때문에 이력 화면이 늦게 뜨지 않게 하기 위해서다.
function loadSections() {
  $.ajax({
    type: 'POST', url: API_BASE + 'sections', data: {}, global: false,
    success: function (ret) {
      if (ret && ret.ret == 'success' && Array.isArray(ret.data)) {
        LIBS = ret.data;
        buildLibFilter();
      }
    }
  });
}

function buildLibFilter() {
  var sel = $('#histLibSel');
  sel.find('option[data-lib]').remove();
  for (var k = 0; k < LIBS.length; k++) {
    sel.append('<option data-lib="1" value="' + LIBS[k].key + '">' + esc(LIBS[k].title) + '</option>');
  }
}

$(document).ready(function () {
  loadSections();
  loadCurrent();
  loadHistory();
  setInterval(function () {
    loadCurrent();
    // 펼쳐 둔 대기중·실행중 상세는 상태가 바뀌면 다시 읽어온다.
    for (var id in expandedIds) loadDetail(id);
  }, 15000);
  // 대기 중인 상세의 대기 시간을 초 단위로 올린다 — 서버가 준 기준점
  // (waiting_seconds)에서 시작해 1초마다 1씩 더한다.
  setInterval(function () {
    $('.wait-timer').each(function () {
      var secs = parseInt($(this).data('secs'), 10) || 0;
      secs += 1;
      $(this).data('secs', secs);
      $(this).text(fmtWait(secs));
    });
  }, 1000);

  $(document).off('click', '#trashCancelBtn').on('click', '#trashCancelBtn', function () {
    globalSendCommand('cancel_current', null);
    setTimeout(loadCurrent, 2000);
  });

  $('#histLibSel').off('change').on('change', function () { loadHistory(1); });
  $('#histOnlyAppend').off('change').on('change', function () { loadHistory(1); });
  $('#histSearchBtn').off('click').on('click', function () { loadHistory(1); });
  $('#histSearch').off('keypress').on('keypress', function (e) {
    if (e.which == 13) { e.preventDefault(); loadHistory(1); }
  });
  $('#histResetBtn').off('click').on('click', function () {
    $('#histLibSel').val('');
    $('#histOnlyAppend').prop('checked', false);
    $('#histSearch').val('');
    loadHistory(1);
  });

  $(document).off('click', '.hist-row').on('click', '.hist-row', function () {
    var id = $(this).data('id');
    if (expandedIds[id]) delete expandedIds[id];
    else { expandedIds[id] = true; }
    loadHistory(histPage, function () { if (expandedIds[id]) loadDetail(id); });
  });

  $(document).off('click', '.append-group-toggle').on('click', '.append-group-toggle', function (e) {
    e.preventDefault();
    e.stopPropagation();
    var gidx = $(this).data('gidx');
    var id = $(this).data('id');
    $('.append-group-files[data-gidx="' + gidx + '"][data-id="' + id + '"]').toggle();
  });

  // 누락이 있으면 휴지통으로 — 대시보드 '휴지통 상세'와 같은 이동 방식이다.
  // ?key=로 라이브러리를 넘기면 휴지통 페이지가 그 라이브러리를 미리 골라 둔다.
  $(document).off('click', '.trash-goto').on('click', '.trash-goto', function (e) {
    e.preventDefault();
    e.stopPropagation();
    var key = $(this).data('key');
    if (key === null || key === undefined || key === '') return;
    location.href = '/' + location.pathname.split('/')[1] + '/scan/trash?key=' + key;
  });

  $('#histRefreshBtn').off('click').on('click', function () {
    loadCurrent();
    loadHistory(histPage);
  });

  $('#histExpandAllBtn').off('click').on('click', function () {
    $('.hist-row').each(function () {
      var id = $(this).data('id');
      expandedIds[id] = true;
    });
    loadHistory(histPage, function () {
      $('.hist-row').each(function () { loadDetail($(this).data('id')); });
    });
  });

  $('#histCollapseAllBtn').off('click').on('click', function () {
    expandedIds = {};
    loadHistory(histPage);
  });
});
</script>
{% endblock %}
