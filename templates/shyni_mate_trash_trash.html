{% extends "base.html" %}
{% block content %}
<style>
@keyframes ovBarSlide { from { background-position: 0 0; } to { background-position: 40px 0; } }
.ov-loading-bar {
  height: 100%; width: 100%;
  background-color: #3182ce;
  background-image: linear-gradient(45deg, rgba(255,255,255,.25) 25%, transparent 25%, transparent 50%, rgba(255,255,255,.25) 50%, rgba(255,255,255,.25) 75%, transparent 75%);
  background-size: 40px 40px;
  animation: ovBarSlide 1s linear infinite;
}
</style>

<div id="trash_progress_wrap" style="display:none; margin-top:10px">
  <div style="height:8px; background:#edf2f7; border-radius:4px; overflow:hidden">
    <div id="trash_progress_bar" style="height:100%; width:0%; background:#3182ce; transition:width .3s ease"></div>
  </div>
  <div id="trash_progress_text" style="font-size:12.5px; color:#666; margin-top:4px">조회를 준비하고 있습니다…</div>
</div>

<div style="display:flex; gap:6px; align-items:center; margin:10px 0 0">
  <div id="trash_lib_pick" class="form-control" style="flex:1; cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:#888; height:31px; padding:3px 8px; font-size:14px">라이브러리를 선택해 주세요</div>
  <input type="hidden" id="trash_lib" value="">
  <button type="button" class="btn btn-sm btn-outline-secondary" id="trash_back_btn" style="flex:0 0 auto; display:none">‹ 전체 현황</button>
  <button type="button" class="btn btn-sm btn-primary" id="trash_query_btn" style="flex:0 0 auto">조회</button>
  <button type="button" class="btn btn-sm btn-outline-primary" id="trash_query_all_btn" title="모두 조회" style="flex:0 0 auto">모두 조회</button>
</div>

<div id="trash_ov_head" style="display:none; justify-content:space-between; align-items:center; margin:10px 0 6px">
  <div style="font-size:13px; font-weight:bold">전체 현황</div>
  <span style="display:flex; align-items:center; gap:10px; white-space:nowrap">
    <span style="position:relative; display:inline-block; white-space:nowrap; font-size:12px; color:#888">표시 <button type="button" id="trash_show_btn" class="btn btn-default" style="height:31px; padding:2px 8px; font-size:12px; vertical-align:middle">전체 ▾</button><span id="trash_show_panel" style="display:none; position:absolute; right:0; top:35px; z-index:30; background:#fff; border:1px solid #cbd5e0; border-radius:6px; box-shadow:0 6px 18px rgba(0,0,0,.13); padding:8px 10px; min-width:215px; text-align:left; color:#2d3748"><input type="text" id="trash_show_search" class="form-control" placeholder="라이브러리 검색" style="height:26px; font-size:12.5px; padding:2px 8px; margin-bottom:6px"><label style="display:flex; gap:7px; align-items:center; font-size:13px; font-weight:600; padding:3px 2px; border-bottom:1px solid #edf2f7; margin:0 0 4px 0; cursor:pointer"><input type="checkbox" id="trash_show_all" checked> 전체</label><span id="trash_show_rows" style="display:block; max-height:280px; overflow-y:auto"></span></span></span>
    <label style="font-size:12px; color:#888; font-weight:normal; margin:0; white-space:nowrap">정렬 <select id="trashOverviewSort" onchange="setTrashOverviewSort(this.value)" style="display:inline-block; width:auto; height:31px; padding:2px 6px; font-size:12px; vertical-align:middle"><option value="trash_desc"{% if (arg.get('trash_overview_sort') or 'trash_desc') == 'trash_desc' %} selected{% endif %}>휴지통</option><option value="name"{% if arg.get('trash_overview_sort') == 'name' %} selected{% endif %}>이름</option><option value="default"{% if arg.get('trash_overview_sort') == 'default' %} selected{% endif %}>기본</option></select></label>
  </span>
</div>
<div id="trash_overview"></div>

<div id="trash_bulk_toast" style="display:none; position:fixed; left:50%; bottom:26px; transform:translateX(-50%); background:#2d3748; color:#fff; font-size:13.5px; padding:10px 20px; border-radius:8px; box-shadow:0 6px 18px rgba(0,0,0,.25); z-index:3000; white-space:nowrap"></div>

<div id="trashLibModal" style="display:none; position:fixed; left:0; top:0; width:100%; height:100%; background:rgba(0,0,0,0.45); z-index:2000">
  <div style="background:#fff; max-width:520px; margin:48px auto; border-radius:8px; padding:16px 18px; max-height:82vh; display:flex; flex-direction:column">
    <div style="display:flex; justify-content:space-between; align-items:center">
      <strong style="font-size:15px">라이브러리 선택</strong>
      <label style="font-size:12px; color:#888; font-weight:normal; margin:0; white-space:nowrap">정렬
        <select id="trashLibSort" style="display:inline-block; width:auto; height:31px; padding:2px 6px; font-size:12px; vertical-align:middle">
          <option value="default">기본</option>
          <option value="name">이름</option>
          <option value="trash_desc">휴지통</option>
        </select>
      </label>
    </div>
    <input type="text" id="trashLibSearch" class="form-control input-sm" placeholder="라이브러리 이름으로 검색" style="margin:10px 0 8px; height:31px; padding:3px 8px; font-size:14px">
    <div id="trashLibList" style="overflow-y:auto; border:1px solid #eee; border-radius:6px; padding:6px 10px; min-height:80px"></div>
    <div style="margin-top:12px; text-align:right">
      <button type="button" class="btn btn-sm btn-outline-primary" id="trashLibCancel">취소</button>
    </div>
  </div>
</div>

<div id="trash_summary" style="font-size:13px; color:#555; margin-top:10px"></div>

<div id="trash_tools" style="display:none">
  <div style="display:flex; gap:6px; margin-top:8px">
    <input type="text" id="trash_search" class="form-control" placeholder="제목·경로 검색" style="flex:1; min-width:0; height:31px; padding:3px 8px; font-size:14px">
    <select id="trash_order" class="form-control" style="flex:0 0 auto; width:auto; height:31px; padding:3px 8px; font-size:14px">
      <option value="old">삭제 오래된 순</option>
      <option value="new">삭제 최근 순</option>
      <option value="files">파일 많은 순</option>
      <option value="name">이름순</option>
    </select>
  </div>
  <div style="margin-top:8px; display:flex; align-items:center; gap:10px; flex-wrap:wrap">
    <button type="button" class="btn btn-sm btn-outline-danger" id="trash_act_empty_selected" style="font-size:13px" disabled>선택 비우기</button>
    <button type="button" class="btn btn-sm btn-outline-danger" id="trash_empty_all_btn" style="font-size:13px">이 라이브러리 전체 비우기</button>
    <span style="font-size:12.5px; color:#888">선택 항목 비우기는 보관 기간 초과 대상만 비워집니다.</span>
  </div>
  <div id="trash_sel_bar" style="margin-top:10px; border-top:1px solid #edf2f7; padding-top:8px">
    <div style="display:flex; gap:6px; flex-wrap:wrap">
      <button type="button" class="btn btn-sm btn-outline-primary trash-sel-act" id="trash_act_refresh" data-mode="refresh" style="font-size:13px" disabled>새로고침</button>
      <button type="button" class="btn btn-sm btn-outline-primary trash-sel-act" id="trash_act_scan" data-mode="scan" style="font-size:13px" disabled>스캔</button>
      <button type="button" class="btn btn-sm btn-outline-primary trash-sel-act" id="trash_act_refresh_scan" data-mode="refresh_scan" style="font-size:13px" disabled>새로고침 후 스캔</button>
    </div>
    <div id="trash_sel_status" style="display:none; font-size:12.5px; color:#555; margin-top:6px"></div>
  </div>
</div>

<div id="trash_basis" style="display:none; font-size:12.5px; color:#888; margin-top:10px; text-align:right"></div>

<div id="trash_check_row" style="display:none; margin-top:8px">
  <label style="font-size:12.5px; color:#666; font-weight:normal; margin:0"><input type="checkbox" id="trash_check_all"> 현재 페이지 전체 선택</label>
  <span id="trash_sel_count" style="font-size:12.5px; color:#555; margin-left:8px">선택 0개</span>
</div>

<div id="trash_list_div" style="margin-top:10px"></div>

<div id="trash_pager" style="display:none; margin-top:12px; text-align:center">
  <button type="button" class="btn btn-sm btn-outline-secondary" id="trash_prev_btn">‹ 이전</button>
  <span id="trash_page_info" style="font-size:12.5px; color:#666; margin:0 10px"></span>
  <button type="button" class="btn btn-sm btn-outline-secondary" id="trash_next_btn">다음 ›</button>
</div>

<div id="trash_bottom_spacer" style="height:30px"></div>

<script type="text/javascript">
// 라이브러리 목록은 페이지가 뜬 뒤 ajax('sections')로 따로 불러온다 —
// shyni가 느려져도 페이지 표시가 막히지 않게 하기 위해서다 (0.9.9).
// 목록은 서버에서 5분간 캐시한다.
var LIBS = [];
var LIBS_STATE = 'loading'; // loading | ok | fail
var API_BASE = '/' + location.pathname.split('/')[1] + '/ajax/trash/';
var PRESELECT = {{ arg['trash_preselect']|default('')|tojson }};
var trashPage = 1;
var trashData = null;

function esc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
}
function fmtNum(n) {
  if (n === null || n === undefined) return '-';
  return Number(n).toLocaleString();
}
// 삭제 사유는 영문 그대로 표시한다 (사용자 지시, 2026-11-17)
// scan_missing · manual · library_folder_removed · reclassified_local_extra
function reasonLabel(r) {
  return r;
}
function daysSince(dtStr) {
  if (!dtStr) return null;
  // 서버 시각은 UTC 벽시계 문자열이다 — 'Z'를 붙여 UTC로 해석해야
  // 브라우저 로컬 시간(KST)으로 잘못 읽어 하루가 어긋나지 않는다
  var s = String(dtStr).replace(' ', 'T');
  if (!/[Zz]$|[+-]\d{2}:?\d{2}$/.test(s)) s += 'Z';
  var t = new Date(s);
  if (isNaN(t.getTime())) return null;
  var d = Math.floor((Date.now() - t.getTime()) / 86400000);
  return d >= 0 ? d : null;
}

var trashCounts = {{ arg['trash_counts_init']|tojson }};

function libByKey(key) {
  for (var i = 0; i < LIBS.length; i++) if (String(LIBS[i].key) === String(key)) return LIBS[i];
  return null;
}

// 선택 칸 표시 갱신 — 값은 hidden input(#trash_lib)이 들고 있고, 칸에는
// 선택된 라이브러리 이름과 휴지통 개수를 보여 준다. 처음에는 현황에서
// 넘어온 라이브러리(PRESELECT)만 선택돼 있고, 그 외에는 아무것도
// 선택되지 않은 상태로 '라이브러리를 선택해 주세요'를 보여 준다.
function renderLibOptions(counts) {
  if (counts) trashCounts = counts;
  var el = $('#trash_lib_pick');
  if (LIBS_STATE === 'loading') {
    el.text('라이브러리 목록을 불러오는 중입니다…').css('color', '#888');
    renderTrashOverview();
    return;
  }
  if (!LIBS.length) {
    $('#trash_lib').val('');
    el.text('라이브러리 목록을 가져오지 못했습니다').css('color', '#c0392b');
    renderTrashOverview();
    return;
  }
  var cur = $('#trash_lib').val();
  if (cur && !libByKey(cur)) cur = '';
  if (!cur && PRESELECT && libByKey(PRESELECT)) {
    cur = String(PRESELECT);
    $('#trash_lib').val(cur);
  }
  if (!cur) {
    $('#trash_lib').val('');
    el.text('라이브러리를 선택해 주세요').css('color', '#888');
    renderTrashOverview();
    return;
  }
  var lib = libByKey(cur);
  var c = trashCounts ? trashCounts[lib.key] : null;
  el.text(lib.title + (c != null ? ' (' + fmtNum(c) + '개)' : '')).css('color', '');
  renderTrashOverview();
}

function loadSections() {
  $.ajax({
    type: 'POST', url: API_BASE + 'sections', data: {}, global: false,
    success: function (ret) {
      if (ret && ret.ret == 'success' && Array.isArray(ret.data)) {
        LIBS = ret.data;
        LIBS_STATE = 'ok';
      } else {
        LIBS_STATE = 'fail';
      }
      renderLibOptions(null);
      // 현황에서 넘어온 경우(PRESELECT)는 목록이 있어야 선택이 되므로
      // 목록을 받은 뒤에 개수와 캐시를 확인한다.
      if (LIBS_STATE === 'ok') loadCounts(!!PRESELECT);
    },
    error: function () {
      LIBS_STATE = 'fail';
      renderLibOptions(null);
    }
  });
}

// 라이브러리별 캐시 저장 시각 {키: epoch} — 팝업의 '캐시 있음' 표시용.
// 첫 값은 페이지가 뜰 때 서버가 함께 실어 보낸 것이라, 응답을 기다리지
// 않고 처음부터 표시된다. 이후 trash_state 응답으로 갱신된다.
var trashCacheTimes = {{ arg['trash_cache_times']|tojson }};

// 라이브러리별 상세 요약 {키: {files, groups, missing, trashed,
// main_label}} — 전체 현황 행의 상세 내역 표시용. 첫 값은 페이지가
// 뜰 때 서버가 함께 실어 보내고, 이후 trash_counts 응답으로 갱신된다.
// 조회한 적 없는 라이브러리는 들어 있지 않다.
var trashSummaries = {{ arg['trash_summaries_init']|tojson }};

function fmtAgo(ts) {
  if (!ts) return '';
  var sec = Math.max(0, Math.floor(Date.now() / 1000 - ts));
  if (sec < 60) return sec + '초 전';
  var min = Math.floor(sec / 60);
  if (min < 60) return min + '분 전';
  var hour = Math.floor(min / 60);
  if (hour < 24) return hour + '시간 전';
  return Math.floor(hour / 24) + '일 전';
}

// ---- 진입 현황 로딩 표시 ----
// 현황은 서버 진행률이 없는 단일 요청이라, 움직이는 막대와 경과 시간으로
// 기다리는 중임을 보여 준다. 현황이 나오면 이 자리 전체가 현황으로 바뀐다.
var trashOvTimer = null;
var trashOvStart = 0;
var trashOvKind = ''; // '' | 'loading'
function trashOvLoadingHtml() {
  return '<div style="padding:16px 4px">'
    + '<div style="height:8px; background:#edf2f7; border-radius:4px; overflow:hidden">'
    + '<div class="ov-loading-bar"></div>'
    + '</div>'
    + '<div style="font-size:12.5px; color:#888; margin-top:6px">현황을 불러오는 중입니다… <span id="trash_ov_elapsed"></span></div>'
    + '</div>';
}
function trashOvElapsedText() {
  var s = Math.max(0, Math.floor((Date.now() - trashOvStart) / 1000));
  if (s < 60) return s + '초 경과';
  return Math.floor(s / 60) + '분 ' + (s % 60) + '초 경과';
}
function startTrashOvTimer() {
  if (trashOvTimer) return;
  trashOvTimer = setInterval(function () {
    var el = $('#trash_ov_elapsed');
    if (!el.length) { stopTrashOvTimer(); return; }
    el.text(trashOvElapsedText());
  }, 1000);
}
function stopTrashOvTimer() {
  if (trashOvTimer) { clearInterval(trashOvTimer); trashOvTimer = null; }
}
function renderTrashOvLoading() {
  if (trashOvKind !== 'loading') {
    trashOvKind = 'loading';
    trashOvStart = Date.now();
    $('#trash_overview').html(trashOvLoadingHtml());
  }
  $('#trash_ov_elapsed').text(trashOvElapsedText());
  startTrashOvTimer();
}

// ---- 진입 현황 ----
// 전체 라이브러리 목록 + 휴지통 개수 + 캐시 정보를 한눈에 보여 준다.
// 휴지통 개수 내림차순으로 정렬한다 (메타 탭 현황과 같은 방식).
// 개수는 대시보드·건강도와 같은 휴지통 개수 캐시를, 캐시 정보는
// 상세 조회 캐시의 저장 시각을 쓴다 — 둘 다 페이지에 이미 실려 있다.
function renderTrashOverview() {
  var el = $('#trash_overview');
  if (LIBS_STATE === 'loading') {
    setTrashOvHead(false);
    renderTrashOvLoading();
    return;
  }
  stopTrashOvTimer();
  trashOvKind = '';
  if (!LIBS.length) {
    setTrashOvHead(false);
    el.html('<div style="padding:16px 4px; color:#c0392b">라이브러리 목록을 가져오지 못했습니다.</div>');
    return;
  }
  // 상세 화면에서는 머리말을 보여 주지 않는다 — 조회 완료 후 개수 갱신
  // (loadCounts → renderLibOptions)이 상세에서도 현황을 다시 그리기
  // 때문이다. 행은 숨은 채로 갱신해 두면 전체 현황으로 돌아갈 때 새 값이 보인다.
  // 메타는 renderLibOptions가 현황을 다시 그리지 않아 이 문제가 없다.
  if ($('#trash_overview').is(':visible')) setTrashOvHead(true);
  else setTrashOvHead(false);
  buildTrashShowPanel(LIBS);
  var rows = sortedTrashOverviewRows().filter(function (lib) { return !trashHiddenLibs[String(lib.key)]; });
  if (!rows.length) {
    el.html('<div style="color:#888; font-size:13px; padding:14px 4px">표시할 라이브러리가 없습니다. 위쪽 표시에서 라이브러리를 선택해 주세요.</div>');
    return;
  }
  var str = '<div style="border:1px solid #e2e8f0; border-radius:8px; overflow:hidden">';
  for (var i = 0; i < rows.length; i++) {
    var lib = rows[i];
    var c = trashCounts ? trashCounts[String(lib.key)] : null;
    var cat = trashCacheTimes[String(lib.key)] || 0;
    var s = trashSummaries ? trashSummaries[String(lib.key)] : null;
    // 파일 수 — 개수 캐시가 우선이고, 없으면 상세 요약의 값을 쓴다.
    var files = c != null ? c : (s && s.files != null ? s.files : null);
    var groupPart = '';
    if (s && s.groups != null && s.main_label) {
      groupPart = ' (' + esc(s.main_label) + ' ' + fmtNum(s.groups) + '개)';
    }
    // 둘째 줄 — 파일 수와 상태 내역을 한 줄에 둔다. 제목까지
    // 세 줄이 되면 행이 너무 길어진다. 비어 있으면 '비어 있음',
    // 조회한 적 없으면 '-'로 보여 준다.
    var statusPart;
    if (files != null && files === 0) {
      statusPart = '비어 있음';
    } else if (s && s.missing != null && s.trashed != null) {
      statusPart = 'missing ' + fmtNum(s.missing) + '개 · trashed ' + fmtNum(s.trashed) + '개';
    } else {
      statusPart = 'missing - · trashed -';
    }
    str += '<div class="trash-ov-row" data-key="' + lib.key + '" style="padding:8px 10px; cursor:pointer' + (i > 0 ? '; border-top:1px solid #edf2f7' : '') + '">'
      + '<div style="display:flex; justify-content:space-between; gap:8px; align-items:baseline">'
      + '<span style="font-weight:bold">' + esc(lib.title) + '</span>'
      + (cat ? '<span style="display:inline-block; font-size:11px; padding:1px 6px; border-radius:8px; background:#ebf8ff; color:#2b6cb0; border:1px solid #bee3f8; white-space:nowrap">캐시 있음 (' + fmtAgo(cat) + ')</span>'
              : '<span style="display:inline-block; font-size:11px; padding:1px 6px; border-radius:8px; background:#f7fafc; color:#718096; border:1px solid #e2e8f0; white-space:nowrap">캐시 없음</span>')
      + '</div>'
      + '<div style="font-size:12.5px; margin-top:2px"><span style="color:#c05621">파일 ' + (files != null ? fmtNum(files) + '개' : '-') + groupPart + '</span> <span style="color:#888">· ' + statusPart + '</span></div>'
      + '</div>';
  }
  str += '</div>';
  el.html(str);
}

function showTrashOverview() {

// 표시 중인 결과의 기준(캐시/Shyni 조회)과 그 시각 — renderTrash가 표시한다
var trashBasisKind = null;
var trashBasisAt = 0;

function fmtElapsedMs(ms) {
  var s = ms / 1000;
  if (s < 60) return s.toFixed(1) + '초';
  return Math.floor(s / 60) + '분 ' + Math.round(s % 60) + '초';
}

// 완료 문구 — 대시보드·건강도와 같은 형식: 불러오기 완료 · 소요시간 · (N분 전)
function trashDoneText(startedAt, finishedAt) {
  var txt = '불러오기 완료';
  if (startedAt && finishedAt && finishedAt >= startedAt) {
    txt += ' · 소요시간 ' + fmtElapsedMs((finishedAt - startedAt) * 1000);
  }
  var a = fmtAgo(finishedAt);
  if (a) txt += ' · (' + a + ')';
  return txt;
}

function fmtBasisTime(ts) {
  if (!ts) return '';
  var d = new Date(ts * 1000);
  function p(n) { return (n < 10 ? '0' : '') + n; }
  return p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}

function paintBasis() {
  var el = $('#trash_basis');
  if (!trashData || !trashBasisKind) { el.hide(); return; }
  var a = fmtAgo(trashBasisAt);
  if (trashBasisKind == 'cache') el.text('캐시 데이터 기준' + (a ? ' (' + a + ')' : ''));
  else el.text('API 조회 결과' + (a ? ' (' + a + ')' : ''));

}

// 저장된 캐시가 있으면 목록을 캐시로 보여 준다 — 결과는 cb로 알린다:
// true=캐시로 보여 줌, false=서버가 확인한 '캐시 없음',
// null=확인 요청 자체가 실패(재시작 중 등)해 알 수 없음.
// 확인 실패를 '캐시 없음'으로 잘못 알리지 않기 위해 구분한다.
// 같은 라이브러리의 계산이 돌고 있거나 접수돼 있으면, 캐시를 먼저
// 보여 준 채로 완료를 지켜보다가 끝나면 목록을 새 결과로 바꾼다.
function tryShowCache(lib, cb) {
  var attempt = function (retried) {
    quietCommand('trash_state', null, null, function (ret) {
      if (!ret || ret.ret != 'success' || !ret.data) {
        if (!retried) { setTimeout(function () { attempt(true); }, 800); return; }
        if (cb) cb(null);
        return;
      }
      trashCacheTimes = ret.data.cache_times || trashCacheTimes;
      var libs = (ret.data.cache_libs || []).map(function (x) { return String(x); });
      if (libs.indexOf(String(lib)) < 0) { if (cb) cb(false); return; }
      trashBasisKind = 'cache';
      trashBasisAt = (ret.data.cache_times || {})[String(lib)] || 0;
      resetProgressCounters();
      loadTrash(1);
      var st0 = ret.data.state || {};
      if (String(st0.lib) === String(lib)
          && (st0.busy || (st0.requested_at || 0) > (st0.finished_at || 0))) {
        watchCacheRefresh(lib);
      } else {
        // 계산이 돌고 있지 않으면 캐시를 불러온 것으로 완료 표시한다
        setProgress(100, trashDoneText(0, trashBasisAt));
      }
      if (cb) cb(true);
    });
  };
  attempt(false);
}

var trashWatchTimer = null;
var trashWatchLib = null;
var trashWatchSince = 0;

function stopCacheWatch() {
  clearTimeout(trashWatchTimer);
  trashWatchTimer = null;
  trashWatchLib = null;
}

// 캐시를 보여 준 상태에서 계산 완료를 지켜본다 — 도는 동안은 진척률을
// 보여 주고, 끝나면(진척률 100%) 목록을 새 결과로 다시 그린다.
function watchCacheRefresh(lib) {
  stopCacheWatch();
  trashWatchLib = String(lib);
  trashWatchSince = Date.now();
  var baseCacheAt = trashCacheTimes[trashWatchLib] || 0;
  var finishWith = function (at, st) {
    var watchSinceSec = Math.floor(trashWatchSince / 1000);
    stopCacheWatch();
    var started = (st && String(st.lib) === trashWatchLib) ? st.started_at : 0;
    // 지켜보기 시작한 시각보다 이른 시작 시각은 낡은 상태 값이다
    started = Math.max(started || 0, watchSinceSec);
    trashBasisKind = 'db';
    trashBasisAt = at || Math.floor(Date.now() / 1000);
    setProgress(100, trashDoneText(started, trashBasisAt));
    loadCounts(false);
    loadTrash(trashPage || 1);
  };
  var tick = function () {
    if (!trashWatchLib) return;
    if (Date.now() - trashWatchSince > 10 * 60 * 1000) { stopCacheWatch(); return; }
    quietCommand('trash_state', null, null, function (ret) {
      if (!trashWatchLib) return;
      if (!ret || ret.ret != 'success' || !ret.data) { trashWatchTimer = setTimeout(tick, 2000); return; }
      trashCacheTimes = ret.data.cache_times || trashCacheTimes;
      // 그 사이 캐시가 새것으로 바뀌었으면(다른 계산이 먼저 끝난 경우
      // 포함) 완료로 본다
      if ((trashCacheTimes[trashWatchLib] || 0) > baseCacheAt) {
        finishWith(trashCacheTimes[trashWatchLib], ret.data.state);
        return;
      }
      var st = ret.data.state || {};
      if (String(st.lib) != trashWatchLib) { trashWatchTimer = setTimeout(tick, 2000); return; }
      if (st.busy) {
        setProgress(st.progress || 0, trashStepText(st.progress || 0));
        trashWatchTimer = setTimeout(tick, 2000);
        return;
      }
      if ((st.requested_at || 0) > (st.finished_at || 0)) { trashWatchTimer = setTimeout(tick, 2000); return; }
      // 계산이 끝났는데 캐시 시각이 그대로면 실패로 끝난 것이다 —
      // 보여 준 캐시는 그대로 두고, 취소면 진척률 표시를 정리한다
      if (st.cancelled) setProgress(0, '조회를 취소했습니다.');
      stopCacheWatch();
    });
  };
  trashWatchTimer = setTimeout(tick, 1200);
}

var trashPollTimer = null;
var trashPollLib = null;
var trashMyReq = 0;
var trashPollSince = 0;
var CMD_URL = '/' + location.pathname.split('/')[1] + '/ajax/trash/command';

// 폴링 전용 조용한 명령 — globalSendCommand는 호출할 때마다 프레임워크
// 로딩 표시가 떠서, 0.7초 간격 폴링에서는 화면이 계속 깜빡인다.
function quietCommand(command, arg1, arg2, cb) {
  $.ajax({
    type: 'POST', url: CMD_URL, global: false,
    data: {command: command, arg1: arg1 == null ? '' : arg1, arg2: arg2 == null ? '' : arg2, arg3: ''},
    success: function (ret) { cb(ret); },
    error: function () { cb(null); }
  });
}

// 계산 단계 표시 — 워커가 보고하는 진행률 구간이 곧 단계 경계다:
// 파일 읽기(0~15) · 항목 정보 읽기(15~45) · 작품별 묶기(45~95) · 저장(95~)
function trashStepText(p) {
  if (p < 15) return '삭제된 파일 목록 읽는 중… {P}%';
  if (p < 45) return '작품 정보 읽는 중… {P}%';
  if (p < 95) return '작품별로 정리하는 중… {P}%';
  return '결과 저장 중… {P}%';
}

// 서버 진행률은 첫 쿼리가 끝날 때까지 한참 멈춰 있을 수 있어(파일 목록을
// 읽는 동안은 콜백이 없다), 현황 화면처럼 표시값을 천천히 올려 보여 준다.
// 실제값이 표시값보다 커지면 그때부터 실제값을 따라간다.
var trashCreepTimer = null;
var trashShownPct = 0;
var trashServerPct = 0;
var trashPctText = '';

function paintTrashProgress() {
  $('#trash_progress_bar').css('width', trashShownPct + '%');
  if (trashPctText) $('#trash_progress_text').text(trashPctText.replace('{P}', Math.round(trashShownPct)));
}

function setProgress(pct, text) {
  $('#trash_progress_wrap').show();
  trashServerPct = Math.max(0, Math.min(100, pct || 0));
  if (trashServerPct >= 100) trashShownPct = 100;
  else if (trashServerPct > trashShownPct) trashShownPct = trashServerPct;
  if (text) trashPctText = text;
  paintTrashProgress();
}

function startTrashCreep() {
  stopTrashCreep();
  trashCreepTimer = setInterval(function () {
    if (trashShownPct < 90) {
      trashShownPct = Math.min(90, trashShownPct + Math.max(1, Math.round((90 - trashShownPct) * 0.02)));
      paintTrashProgress();
    }
  }, 400);
}

function stopTrashCreep() {
  if (trashCreepTimer) { clearInterval(trashCreepTimer); trashCreepTimer = null; }
}

// 진척률은 현황·건강도처럼 지우지 않고 마지막 상태를 계속 보여 준다.
// 여기서는 다음 표시를 위해 카운터만 되돌리고, 막대 자체는 건드리지 않는다.
function resetProgressCounters() {
  trashShownPct = 0;
  trashServerPct = 0;
  trashPctText = '';
}

function stopTrashPolling() {
  clearTimeout(trashPollTimer);
  trashPollTimer = null;
  trashPollLib = null;
  trashMyReq = 0;
  stopTrashCreep();
  stopCacheWatch();
  paintQueryStopped();
  resetProgressCounters();
}

// 전체 조회 — 모든 라이브러리를 순서대로 조회해 캐시를 채운다.
// 진행 상황은 서버 상태(trash_bulk_state)를 폴링해 토스트로 보여 준다.
var trashBulkActive = false;
var trashBulkTimer = null;
var trashAllBtnHtml = null;
function showBulkToast(text, holdMs) {
  var t = $('#trash_bulk_toast');
  t.stop(true, true).text(text).show();
  if (holdMs) setTimeout(function () { if (!trashBulkActive) t.fadeOut(300); }, holdMs);
}
function paintBulkRunning(bulk) {
  var btn = $('#trash_query_all_btn');
  if (trashAllBtnHtml == null) trashAllBtnHtml = btn.html();
  btn.removeClass('btn-default').addClass('btn-outline-danger').text('조회 취소');
  $('#trash_query_btn').prop('disabled', true);
  var n = (bulk.done || 0) + (bulk.current ? 1 : 0);
  showBulkToast('휴지통을 조회 중입니다. (' + n + '/' + (bulk.total || 0) + ')');
}
function paintBulkStopped() {
  var btn = $('#trash_query_all_btn');
  btn.removeClass('btn-outline-danger').addClass('btn-default').html(trashAllBtnHtml);
  $('#trash_query_btn').prop('disabled', false);
}
function pollBulk() {
  clearTimeout(trashBulkTimer);
  quietCommand('trash_state', null, null, function (ret) {
    if (!ret || ret.ret != 'success' || !ret.data) { trashBulkTimer = setTimeout(pollBulk, 2000); return; }
    trashCacheTimes = ret.data.cache_times || trashCacheTimes;
    var bulk = ret.data.bulk || {};
    if (bulk.active) { paintBulkRunning(bulk); trashBulkTimer = setTimeout(pollBulk, 1500); return; }
    if (trashBulkActive) {
      trashBulkActive = false;
      paintBulkStopped();
      loadCounts(false);
      if (bulk.cancelled) showBulkToast('휴지통 조회가 취소되었습니다.', 3500);
      else if (bulk.errors) showBulkToast('휴지통 조회가 완료되었습니다. (' + bulk.errors + '개 라이브러리는 조회에 실패했습니다)', 5000);
      else showBulkToast('휴지통 조회가 완료되었습니다.', 4000);
    }
  });
}

var trashQueryForce = '';

function sendTrashQuery() {
  quietCommand('trash_query', trashPollLib, trashQueryForce, function (ret) {
    if (ret && ret.ret == 'success' && ret.data && ret.data.from_cache) {
      // 서버가 캐시를 확인해 계산을 시작하지 않았다 — 캐시로 보여 준다
      var lib2 = trashPollLib;
      stopTrashPolling();
      tryShowCache(lib2, function (shown) {
        if (shown === null) setTimeout(function () { tryShowCache(lib2, function () {}); }, 1500);
      });
      return;
    }
    if (ret && ret.ret == 'success' && ret.data && String(ret.data.lib) == trashPollLib) {
      trashMyReq = ret.data.requested_at || 0;
    }
    pollTrashState();
  });
}

function startQuery(force) {
  // 전체 조회 중에는 새 조회를 시작하지 않는다 — 캐시된 것만 볼 수 있다
  if (trashBulkActive) return;
  var lib = $('#trash_lib').val();
  if (!lib) return;
  // 캐시 확인보다 조회가 먼저 눌린 경우의 방어 — '최신으로 조회'가
  // 아닌데 캐시가 이미 있으면, 계산하지 않고 캐시를 보여 준다
  if (!force && trashCacheTimes[String(lib)]) {
    tryShowCache(lib, function (shown) {
      if (shown === false) startQuery(true);
      else if (shown === null) {
        // 확인이 실패한 경우 — 잠시 뒤 캐시 확인부터 다시 한다
        setTimeout(function () {
          if ($('#trash_lib').val() === String(lib) && !trashData && !trashPollLib) startQuery(false);
        }, 3000);
      }
    });
    return;
  }
  trashQueryForce = force ? '1' : '';
  // 같은 라이브러리 조회가 이미 진행 중이면 다시 시작하지 않는다.
  // (자동 조회가 늦게 겹치면 진척률이 0으로 되돌아가는 문제 방지)
  if (trashPollLib && trashPollLib === String(lib)) return;
  stopTrashPolling();
  trashPollLib = String(lib);
  trashPollSince = Date.now();
  // 새 조회는 새 목록이므로 이전 선택은 비운다
  trashSel = {};
  $('#trash_sel_status').hide();
  paintQueryRunning();
  $('#trash_summary').text('');
  $('#trash_tools').hide();
  $('#trash_pager').hide();
  $('#trash_list_div').html('');
  trashData = null;
  clearBasis();
  trashShownPct = 0;
  trashServerPct = 0;
  setProgress(0, trashStepText(0));
  startTrashCreep();
  sendTrashQuery();
}

function pollTrashState() {
  clearTimeout(trashPollTimer);
  trashPollTimer = setTimeout(function () {
    if (!trashPollLib) return;
    quietCommand('trash_state', null, null, function (ret) {
      if (!trashPollLib) return;
      if (!ret || ret.ret != 'success' || !ret.data) { pollTrashState(); return; }
      var st = ret.data.state || {};
      if (Date.now() - trashPollSince > 10 * 60 * 1000) {
        stopTrashPolling();
        $('#trash_list_div').html('<div style="padding:16px 4px; color:#c0392b">조회가 너무 오래 걸립니다. 잠시 뒤 다시 시도해 주세요.</div>');
        return;
      }
      if (st.busy) {
        if (String(st.lib) == trashPollLib) {
          setProgress(st.progress || 0, trashStepText(st.progress || 0));
        } else {
          setProgress(st.progress || 0, '다른 라이브러리를 불러오는 중입니다… {P}%');
        }
        pollTrashState();
        return;
      }
      if (!trashMyReq) {
        // 다른 라이브러리 계산이 막 끝난 경우 등, 내 요청이 아직 접수되지
        // 않았으면 다시 요청하고 계속 기다린다.
        sendTrashQuery();
        return;
      }
      var finished = (st.finished_at || 0) >= trashMyReq;
      if (finished && st.error && String(st.lib) == trashPollLib) {
        stopTrashPolling();
        $('#trash_list_div').html('<div style="padding:16px 4px; color:#c0392b">휴지통을 조회하지 못했습니다: ' + esc(st.error) + '</div>');
        return;
      }
      if (finished && st.cancelled && String(st.lib) == trashPollLib) {
        // 다른 화면에서 취소한 경우 — 기존 캐시를 보여 준다
        var lib2 = trashPollLib;
        stopTrashPolling();
        showCacheAfterCancel(lib2);
        return;
      }
      var cacheLibs = (ret.data.cache_libs || []).map(function (x) { return String(x); });
      if (finished && cacheLibs.indexOf(trashPollLib) >= 0) {
        stopTrashCreep();
        clearTimeout(trashPollTimer);
        trashPollTimer = null;
        // 소요시간 기준 — 서버 상태의 started_at은 공유 상태라 이전 계산
        // 값이 남을 수 있어 (01:36 계산 값이 03:19 완료에 붙어 102분으로
        // 나온 전례), 이번 요청 시각보다 이른 값은 요청 시각으로 올린다.
        var elapsedStart = Math.max(st.started_at || 0, trashMyReq || 0);
        trashPollLib = null;
        trashMyReq = 0;
        paintQueryStopped();
        trashBasisKind = 'db';
        trashBasisAt = st.finished_at || Math.floor(Date.now() / 1000);
        setProgress(100, trashDoneText(elapsedStart, trashBasisAt));
        // 새 계산이 끝났으니 선택 칸의 개수도 서버 값으로 다시 맞춘다
        loadCounts(false);
        loadTrash(1);
            return;
      }
      pollTrashState();
    });
  }, 700);
}

// 상세 목록 표시 경과 시간 — 현황 로딩 타이머와 같은 방식.
// 목록을 새로 불러올 때마다 시작 시각을 다시 잡는다.
var trashListTimer = null;
var trashListStart = 0;
function trashListElapsedText() {
  var s = Math.max(0, Math.floor((Date.now() - trashListStart) / 1000));
  if (s < 60) return s + '초 경과';
  return Math.floor(s / 60) + '분 ' + (s % 60) + '초 경과';
}
function startTrashListTimer() {
  stopTrashListTimer();
  trashListStart = Date.now();
  $('#trash_list_elapsed').text(trashListElapsedText());
  trashListTimer = setInterval(function () {
    var el = $('#trash_list_elapsed');
    if (!el.length) { stopTrashListTimer(); return; }
    el.text(trashListElapsedText());
  }, 1000);
}
function stopTrashListTimer() {
  if (trashListTimer) { clearInterval(trashListTimer); trashListTimer = null; }
}

function loadTrash(page) {
  var lib = $('#trash_lib').val();
  if (!lib) return;
  trashPage = page || 1;
  // 상세 목록은 데이터(캐시)가 이미 불러와진 뒤 내용을 그리는 단계라,
  // '불러오는 중'이 아니라 '내용을 표시하는 중'으로 쓴다 — 메타와 같은
  // 문구·물결 막대바·경과 시간 (2026-11-20 사용자 지적).
  $('#trash_list_div').html('<div style="padding:16px 4px">'
    + '<div style="height:8px; background:#edf2f7; border-radius:4px; overflow:hidden">'
    + '<div class="ov-loading-bar"></div>'
    + '</div>'
    + '<div style="font-size:12.5px; color:#888; margin-top:6px">내용을 표시하는 중입니다… <span id="trash_list_elapsed"></span></div>'
    + '</div>');
  startTrashListTimer();
  var opts = {
    page: trashPage,
    search: $('#trash_search').val() || '',
    order: $('#trash_order').val() || 'old'
  };
  quietCommand('trash_list', lib, JSON.stringify(opts), function (ret) {
    stopTrashListTimer();
    if (!ret || ret.ret != 'success') {
      $('#trash_summary').text('');
      $('#trash_tools').hide();
      $('#trash_pager').hide();
      clearBasis();
      $('#trash_list_div').html('<div style="padding:16px 4px; color:#c0392b">' + esc((ret && ret.msg) || '조회에 실패했습니다.') + '</div>');
      return;
    }
    trashData = ret.data;
    renderTrash();
  });
}

function renderTrash() {
  var d = trashData;
  if (!d) return;
  var s = d.summary || {};
  var sumHtml = '파일 <strong>' + fmtNum(s.files) + '개</strong> (' + esc(d.main_label) + ' <strong>' + fmtNum(s.groups) + '개</strong>)';
  // 둘째 줄 — 메타 상세 요약과 같은 두 줄 구조로, 상태별 내역과
  // 보관 기간을 함께 보여 준다.
  var sumDetail = '';
  if (s.missing != null && s.trashed != null) {
    sumDetail = 'missing <strong>' + fmtNum(s.missing) + '개</strong> · trashed <strong>' + fmtNum(s.trashed) + '개</strong>';
  }
  if (d.retention_days != null) {
    sumDetail += (sumDetail ? ' · ' : '') + '보관 기간 <strong>' + d.retention_days + '일</strong>';
  }
  if (sumDetail) sumHtml += '<br>' + sumDetail;
  $('#trash_summary').html(sumHtml);
  $('#trash_tools').show();
  // API로 조회한 결과에서는 개별 선택 실행(새로고침·스캔)을 막는다
  // (사용자 지시, 2026-11-17). 선택 비우기는 part_ids만으로 되어
  // API 출처에서도 되므로 체크박스와 선택 비우기는 열어 둔다.
  var apiSource = d.source === 'api';
  $('#trash_sel_bar').show();
  $('#trash_check_row').show();
  $('.trash-sel-act').toggle(!apiSource);
  paintBasis();
  updateQueryBtn();
  var str = '';
  var groups = d.groups || [];
  if (!groups.length) {
    str = '<div style="padding:16px 4px; color:#888">조건에 맞는 항목이 없습니다.</div>';
  }
  for (var i = 0; i < groups.length; i++) {
    var g = groups[i];
    var title = (g.parent_title ? g.parent_title + ' — ' : '') + (g.title || '(제목 없음)') + (g.year ? ' (' + g.year + ')' : '');
    str += '<div style="border:1px solid #e2e8f0; border-radius:8px; padding:10px 8px; margin-top:8px">';
    str += '<div style="display:flex; gap:8px; align-items:flex-start">';
    if (g.folder) {
      str += '<input type="checkbox" class="trash-check" data-folder="' + esc(g.folder) + '"' + (trashSel[g.folder] ? ' checked' : '') + (trashSelBusy ? ' disabled' : '') + ' style="margin-top:3px; flex:0 0 auto">';
    }
    str += '<div style="flex:1; min-width:0"><div><strong>' + esc(title) + '</strong></div>';
    var keptDays = (g.first_days_ago != null ? g.first_days_ago : g.days_ago);
    str += '<div style="font-size:12.5px; color:#666; margin-top:2px">파일 ' + fmtNum(g.file_count) + '개 · 삭제 ' + esc((g.last_deleted || '').substring(0, 10)) + (keptDays != null ? ' · 삭제된 지 ' + keptDays + '일째 · 보관 기간 ' + (d.retention_days || 7) + '일' : '');
    if (g.subs && g.subs.length) {
      var subsTxt = g.subs.length > 4 ? g.subs.slice(0, 4).join('·') + ' 외 ' + (g.subs.length - 4) + '곳' : g.subs.join('·');
      str += ' · 하위 폴더 ' + esc(subsTxt);
    }
    for (var r = 0; r < (g.reasons || []).length; r++) {
      str += ' <span style="display:inline-block; font-size:11px; padding:1px 6px; border-radius:8px; background:#fff5f5; color:#c53030; border:1px solid #fed7d7">' + esc(reasonLabel(g.reasons[r])) + '</span>';
    }
    str += '</div>';
    if (g.folder) str += '<div style="font-size:12px; color:#888; word-break:break-all; margin-top:2px">' + esc(g.folder) + '</div>';
    str += '</div>';
    var stHtml = '';
    for (var si = 0; si < (g.statuses || []).length; si++) {
      if (g.statuses[si] == 'missing') stHtml += '<span style="display:inline-block; font-size:11px; padding:1px 7px; border-radius:8px; background:#fffaf0; color:#c05621; border:1px solid #feebc8; white-space:nowrap; flex:0 0 auto; margin-top:2px">missing</span>';
      else if (g.statuses[si] == 'trashed') stHtml += '<span style="display:inline-block; font-size:11px; padding:1px 7px; border-radius:8px; background:#f7fafc; color:#4a5568; border:1px solid #e2e8f0; white-space:nowrap; flex:0 0 auto; margin-top:2px">trashed</span>';
    }
    if (stHtml) str += stHtml;
    str += '<button type="button" class="btn btn-sm btn-outline-secondary trash-toggle" data-root="' + g.root_id + '" style="flex:0 0 auto">▾</button>';
    str += '</div>';
    str += '<div class="trash-files" id="trash_files_' + g.root_id + '" style="display:none; margin-top:6px"></div>';
    str += '</div>';
  }
  $('#trash_list_div').html(str);
  if (d.pages > 1 || d.total_groups > 0) {
    $('#trash_pager').show();
    $('#trash_page_info').text(d.page + ' / ' + d.pages + ' 페이지 · 전체 ' + fmtNum(d.total_groups) + '개');
    $('#trash_prev_btn').prop('disabled', d.page <= 1);
    $('#trash_next_btn').prop('disabled', d.page >= d.pages);
  } else {
    $('#trash_pager').hide();
  }
  updateSelUi();
}

// ---- 작품 선택 실행 (새로고침·스캔·새로고침 후 스캔) ----
// 선택은 폴더 경로(작품 공통 폴더)를 키로 페이지가 바뀌어도 유지한다.
// 실행은 워커가 전담하고, 화면은 trash_selected_state를 조용한 ajax로
// 폴링해 진행(완료 수/전체 · 현재 폴더)과 결과를 표시한다.
var trashSel = {};
var trashSelBusy = false;
var trashSelTimer = null;
var trashSelMyReq = 0;
var trashSelPendingSince = 0;
var SEL_MODE_LABEL = {refresh: '새로고침', scan: '스캔', refresh_scan: '새로고침 후 스캔'};

function selCount() { return Object.keys(trashSel).length; }

function updateSelUi() {
  var n = selCount();
  $('#trash_sel_count').text('선택 ' + n + '개');
  $('.trash-sel-act').prop('disabled', n === 0 || trashSelBusy);
  $('#trash_act_empty_selected').prop('disabled', n === 0 || trashSelBusy);
  var boxes = $('.trash-check');
  var checked = boxes.filter(':checked').length;
  $('#trash_check_all').prop('checked', boxes.length > 0 && checked === boxes.length);
  $('#trash_check_all').prop('disabled', trashSelBusy || boxes.length === 0);
}

function setSelBusy(busy) {
  trashSelBusy = busy;
  $('.trash-check').prop('disabled', busy);
  updateSelUi();
}

function showSelStatus(html) {
  $('#trash_sel_status').html(html).show();
}

function startSelectedAction(mode) {
  var lib = $('#trash_lib').val();
  var folders = Object.keys(trashSel);
  if (!lib || !folders.length || trashSelBusy) return;
  if (folders.length > 100) {
    showSelStatus('<span style="color:#c0392b">한 번에 최대 100개까지 실행할 수 있습니다. 선택을 줄여 주세요.</span>');
    return;
  }
  setSelBusy(true);
  trashSelMyReq = 0;
  trashSelPendingSince = 0;
  showSelStatus(esc(SEL_MODE_LABEL[mode] || mode) + '을(를) 시작하고 있습니다…');
  quietCommand('trash_selected_action', lib, JSON.stringify({mode: mode, folders: folders}), function (ret) {
    if (!ret || ret.ret != 'success') {
      setSelBusy(false);
      showSelStatus('<span style="color:#c0392b">' + esc((ret && ret.msg) || '실행을 시작하지 못했습니다.') + '</span>');
      return;
    }
    trashSelMyReq = (ret.data && ret.data.requested_at) || Date.now() / 1000;
    pollSelState(mode);
  });
}

function pollSelState(mode) {
  clearTimeout(trashSelTimer);
  trashSelTimer = setTimeout(function () {
    quietCommand('trash_selected_state', null, null, function (ret) {
      if (!ret || ret.ret != 'success' || !ret.data) { pollSelState(mode); return; }
      var st = ret.data;
      var label = SEL_MODE_LABEL[st.mode || mode] || '';
      if (st.busy) {
        trashSelPendingSince = 0;
        var cur = st.current ? '<br><span style="color:#888; word-break:break-all">현재: ' + esc(st.current) + '</span>' : '';
        showSelStatus(esc(label) + ' 진행 중 · ' + (st.done || 0) + '/' + (st.total || 0) + '개 완료' + cur);
        pollSelState(mode);
        return;
      }
      if ((st.finished_at || 0) >= trashSelMyReq && st.requested_at == trashSelMyReq) {
        finishSelAction(st, label);
        return;
      }
      // 요청은 접수됐는데 워커가 아직 집지 않은 상태 — 이 상태가 1분 넘게
      // 이어지면 워커 무응답으로 보고 안내한다 (잠깐의 간격은 계속 기다린다).
      if (!trashSelPendingSince) trashSelPendingSince = Date.now();
      if (Date.now() - trashSelPendingSince > 60 * 1000) {
        setSelBusy(false);
        showSelStatus('<span style="color:#c0392b">작업이 시작되지 않았습니다. 잠시 뒤 다시 시도해 주세요.</span>');
        return;
      }
      pollSelState(mode);
    });
  }, 1000);
}

function finishSelAction(st, label) {
  clearTimeout(trashSelTimer);
  trashSelTimer = null;
  setSelBusy(false);
  var results = st.results || [];
  var ok = 0, fails = '';
  for (var i = 0; i < results.length; i++) {
    if (results[i].ok) ok++;
    else fails += '<br><span style="color:#c0392b; word-break:break-all">실패: ' + esc(results[i].folder) + ' — ' + esc(results[i].error || '') + '</span>';
  }
  var html = esc(label) + '이(가) 끝났습니다. ' + ok + '/' + results.length + '개 성공.';
  if (st.error) html += '<br><span style="color:#c0392b">' + esc(st.error) + '</span>';
  html += fails;
  html += '<br><span style="color:#888">휴지통 내용이 바뀌었을 수 있습니다. 조회 버튼을 눌러 다시 불러와 주세요.</span>';
  showSelStatus(html);
}

// ---- 선택 비우기 (관리자 API, part_ids) ----
// 선택 실행과 달리 워커를 거치지 않는다 — 비우기 자체가 한 번의
// 관리자 API 호출이라 웹에서 바로 끝난다. 보관 기간이 지난 항목만
// 삭제되고, 기간이 남은 항목은 휴지통에 남는다. 결과 문구는
// globalSendCommand가 알림으로 보여 준다 (전체 비우기와 같은 방식).
function startSelectedEmpty() {
  var lib = $('#trash_lib').val();
  var folders = Object.keys(trashSel);
  if (!lib || !folders.length || trashSelBusy) return;
  if (folders.length > 100) {
    showSelStatus('<span style="color:#c0392b">한 번에 최대 100개까지 비울 수 있습니다. 선택을 줄여 주세요.</span>');
    return;
  }
  var libInfo = libByKey(lib);
  var title = libInfo ? libInfo.title : '선택한 라이브러리';
  if (!confirm('선택한 ' + folders.length + '개 항목의 휴지통을 비웁니다. 보관 기간이 지난 항목만 삭제되고, 되돌릴 수 없습니다. 계속하시겠습니까?')) return;
  setSelBusy(true);
  showSelStatus('선택한 항목을 비우는 중입니다…');
  globalSendCommand('trash_empty_selected', lib, JSON.stringify({folders: folders, title: title}), null, function (ret) {
    setSelBusy(false);
    if (!ret || ret.ret != 'success') {
      showSelStatus('<span style="color:#c0392b">' + esc((ret && ret.msg) || '비우지 못했습니다.') + '</span>');
      return;
    }
    trashSel = {};
    updateSelUi();
    $('#trash_sel_status').hide();
    loadCounts(false);
    startQuery();
  });
}

// 화면을 다시 열었을 때 실행 중인 선택 작업이 있으면 진행 표시를 이어간다
function resumeSelPolling() {
  quietCommand('trash_selected_state', null, null, function (ret) {
    if (!ret || ret.ret != 'success' || !ret.data) return;
    var st = ret.data;
    if (st.busy) {
      trashSelMyReq = st.requested_at || 0;
      trashSelPendingSince = 0;
      setSelBusy(true);
      showSelStatus('선택 작업이 진행 중입니다…');
      pollSelState(st.mode);
    }
  });
}

function toggleFiles(btn) {
  var root = btn.data('root');
  var box = $('#trash_files_' + root);
  if (box.is(':visible')) { box.hide(); btn.text('▾'); return; }
  btn.text('▴');
  if (box.data('loaded')) { box.show(); return; }
  box.html('<div style="color:#888; font-size:12.5px; padding:4px 0">불러오는 중입니다…</div>').show();
  quietCommand('trash_files', $('#trash_lib').val(), String(root), function (ret) {
    if (!ret || ret.ret != 'success') {
      box.html('<div style="color:#c0392b; font-size:12.5px; padding:4px 0">' + esc((ret && ret.msg) || '읽지 못했습니다.') + '</div>');
      return;
    }
    var files = (ret.data && ret.data.files) || [];
    var str = '';
    for (var i = 0; i < files.length; i++) {
      var f = files[i];
      var fdays = daysSince(f.deleted_at);
      str += '<div style="font-size:12.5px; color:#555; padding:5px 0 5px 10px; border-top:1px dashed #edf2f7; word-break:break-all">' + esc(f.name) + ' <span style="color:#aaa">' + esc((f.deleted_at || '').substring(0, 10)) + (fdays != null ? ' · ' + fdays + '일째' : '') + '</span></div>';
    }
    if (ret.data && ret.data.total > files.length) {
      str += '<div style="font-size:12px; color:#999; padding:4px 0 0 10px">외 ' + fmtNum(ret.data.total - files.length) + '개 파일</div>';
    }
    if (!files.length) str = '<div style="font-size:12.5px; color:#888; padding:4px 0">파일이 없습니다.</div>';
    box.html(str);
    box.data('loaded', true);
  });
}

$(document).ready(function () {
  renderLibOptions(null);
  renderTrashOverview();
  loadSections();
  // 캐시 시각을 미리 받아 둔다 — 선택 팝업을 열면 '캐시 있음' 표시가
  // 서버 응답을 기다리지 않고 바로 보인다. 화면 표시 뒤에 조용히
  // 물어보는 것이라 처음 뜨는 속도에 영향을 주지 않는다.
  quietCommand('trash_state', null, null, function (ret) {
    if (ret && ret.ret == 'success' && ret.data) {
      trashCacheTimes = ret.data.cache_times || {};
      renderTrashOverview();
    }
  });

  $('#trash_query_btn').off('click').on('click', function () {
    // 조회 중에는 버튼이 '취소' — 누르면 조회를 멈추고 기존 데이터를 쓴다
    if (trashPollLib) { cancelTrashQuery(); return; }
    if (!$('#trash_lib').val()) { openTrashLibPicker(); return; }
    // 목록이 떠 있는 상태의 버튼은 '최신으로 조회' — 캐시가 있어도
    // 다시 계산한다. 목록이 없으면 캐시 먼저 보기 대상이다
    startQuery(!!trashData);
  });
  $('#trash_query_all_btn').off('click').on('click', function () {
    if (trashBulkActive) {
      quietCommand('trash_query_all_cancel', null, null, function () {});
      showBulkToast('휴지통 조회를 취소하는 중입니다…');
      return;
    }
    if (LIBS_STATE !== 'ok' || !LIBS.length) {
      if (window.$ && $.notify) $.notify('라이브러리 목록을 불러오는 중입니다. 잠시 후 다시 시도해 주세요.', 'warn');
      else alert('라이브러리 목록을 불러오는 중입니다. 잠시 후 다시 시도해 주세요.');
      return;
    }
    if (!confirm('라이브러리 별로 모든 휴지통을 조회합니다. 파일 수가 많은 경우 조회에 시간이 걸릴 수 있습니다. 진행하시겠습니까?')) return;
    var keys = LIBS.map(function (l) { return l.key; });
    quietCommand('trash_query_all', JSON.stringify(keys), null, function (ret) {
      if (ret && ret.ret == 'success') {
        trashBulkActive = true;
        paintBulkRunning({done: 0, total: keys.length, current: keys[0]});
        pollBulk();
      } else {
        // 이미 다른 곳에서 전체 조회가 돌고 있을 수 있다 — 상태를 맞춰 본다
        pollBulk();
      }
    });
  });
  // 전체 조회가 돌고 있는 채로 화면에 들어오면 진행 표시를 이어받는다
  quietCommand('trash_state', null, null, function (ret) {
    if (ret && ret.ret == 'success' && ret.data && ret.data.bulk && ret.data.bulk.active) {
      trashBulkActive = true;
      paintBulkRunning(ret.data.bulk);
      pollBulk();
    }
  });
  $('#trash_back_btn').off('click').on('click', function () { backToTrashOverview(); });
  $('#trash_lib_pick').off('click').on('click', function () { openTrashLibPicker(); });
  $('#trashLibSearch').off('input').on('input', renderTrashLibList);
  $('#trashLibSort').off('change').on('change', function () { setTrashLibSort($(this).val()); });
  $('#trashLibCancel').off('click').on('click', function () { closeTrashLibPicker(); });
  $('#trashLibModal').off('click').on('click', function (e) { if (e.target === this) closeTrashLibPicker(); });
  $(document).off('click', '.trash-lib-row').on('click', '.trash-lib-row', function () { onTrashLibPicked($(this).data('key')); });
  $(document).off('click', '.trash-ov-row').on('click', '.trash-ov-row', function () { onTrashLibPicked($(this).data('key')); });
  $('#trash_order').off('change').on('change', function () { if (trashData) loadTrash(1); });
  var searchTimer = null;
  $('#trash_search').off('input').on('input', function () {
    if (!trashData) return;
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function () { loadTrash(1); }, 400);
  });
  $('#trash_prev_btn').off('click').on('click', function () { if (trashData && trashData.page > 1) loadTrash(trashData.page - 1); });
  $('#trash_next_btn').off('click').on('click', function () { if (trashData && trashData.page < trashData.pages) loadTrash(trashData.page + 1); });
  $(document).off('click', '.trash-toggle').on('click', '.trash-toggle', function () { toggleFiles($(this)); });

  $(document).off('change', '.trash-check').on('change', '.trash-check', function () {
    var folder = $(this).data('folder');
    if (!folder) return;
    if ($(this).is(':checked')) trashSel[folder] = true;
    else delete trashSel[folder];
    updateSelUi();
  });
  $('#trash_check_all').off('change').on('change', function () {
    var on = $(this).is(':checked');
    $('.trash-check').each(function () {
      var folder = $(this).data('folder');
      if (!folder) return;
      $(this).prop('checked', on);
      if (on) trashSel[folder] = true;
      else delete trashSel[folder];
    });
    updateSelUi();
  });
  $('.trash-sel-act').off('click').on('click', function () { startSelectedAction($(this).data('mode')); });
  $('#trash_act_empty_selected').off('click').on('click', function () { startSelectedEmpty(); });
  resumeSelPolling();

  $('#trash_empty_all_btn').off('click').on('click', function () {
    var lib = $('#trash_lib').val();
    var libInfo = libByKey(lib);
    var title = libInfo ? libInfo.title : '선택한 라이브러리';
    if (!lib) return;
    if (!confirm(title + ' 휴지통을 전부 비웁니다. 되돌릴 수 없습니다. 계속하시겠습니까?')) return;
    globalSendCommand('trash_empty_all', lib, title, null, function (ret) {
      if (ret && ret.ret == 'success') { loadCounts(false); startQuery(); }
    });
  });
});
</script>
