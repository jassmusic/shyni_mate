{% extends "base.html" %}
{% block content %}

<div class="container-fluid">
  <div class="row show-grid">
    <span class="col-md-12">
      <strong>세션</strong>
    </span>
  </div>
  <div id="sessions_progress_wrap" style="display:none; margin:2px 0 10px 0">
    <div style="height:8px; background:#edf2f7; border-radius:4px; overflow:hidden"><div id="sessions_progress_bar" style="height:100%; width:0%; background:#3182ce; transition:width .4s ease"></div></div>
    <div id="sessions_progress_text" style="font-size:12px; color:#888; margin-top:3px">불러오는 중… 0%</div>
  </div>
  <div class="row show-grid">
    <span class="col-md-12">
      <span style="float:right; display:flex; align-items:center; gap:6px; white-space:nowrap">
        <button type="button" class="btn btn-info" id="sessionsRefreshBtn" style="padding:2px 10px; font-size:12.5px">새로고침</button>
      </span>
    </span>
  </div>
</div>

<div id="sessions_div" style="margin-top:10px; display:none"></div>
<div id="sessions_msg_div" style="padding:24px 4px; color:#888">세션 목록을 불러오는 중입니다. 잠시만 기다려 주세요.</div>

<script type="text/javascript">
var API_BASE = '/' + location.pathname.split('/')[1] + '/ajax/status/';
var refreshTimer = null;
var currentRefreshMin = null;

// 자동 업데이트 주기 — 대시보드·건강도와 같은 설정을 쓴다
function setupTimer(min) {
  if (refreshTimer) { clearInterval(refreshTimer); refreshTimer = null; }
  currentRefreshMin = min;
  if (min > 0) refreshTimer = setInterval(load_sessions, min * 60000);
}

// 진행률 가로바 — 대시보드·건강도와 같은 모양과 동작
var sessionsLoadStartAt = null;
var sessionsProgressValue = 0;
var sessionsProgressTimer = null;
var sessionsProgressDoneOnce = false;

function fmtElapsed(ms) {
  var s = ms / 1000;
  if (s < 60) return s.toFixed(1) + '초';
  return Math.floor(s / 60) + '분 ' + Math.round(s % 60) + '초';
}

function paintSessionsProgress() {
  $('#sessions_progress_wrap').show();
  $('#sessions_progress_bar').css('width', sessionsProgressValue + '%');
  $('#sessions_progress_text').text('세션 목록 불러오는 중… ' + sessionsProgressValue + '%');
}
function startSessionsCreep(cap) {
  if (sessionsProgressTimer) clearInterval(sessionsProgressTimer);
  sessionsProgressTimer = setInterval(function () {
    if (sessionsProgressValue < cap) {
      sessionsProgressValue = Math.min(cap, sessionsProgressValue + Math.max(1, Math.round((cap - sessionsProgressValue) * 0.07)));
      paintSessionsProgress();
    }
  }, 250);
}
function stopSessionsCreep() {
  if (sessionsProgressTimer) { clearInterval(sessionsProgressTimer); sessionsProgressTimer = null; }
}
function finishSessionsProgress() {
  stopSessionsCreep();
  sessionsProgressValue = 100;
  $('#sessions_progress_wrap').show();
  $('#sessions_progress_bar').css('width', '100%');
  var el = sessionsLoadStartAt ? fmtElapsed(Date.now() - sessionsLoadStartAt) : '';
  $('#sessions_progress_text').text('불러오기 완료' + (el ? ' · 소요시간 ' + el : ''));
  sessionsProgressDoneOnce = true;
}

function esc(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function fmtTime(iso) {
  if (!iso) return '-';
  var d = new Date(iso);
  if (isNaN(d.getTime())) return esc(iso);
  var m = d.getMonth() + 1, day = d.getDate();
  var h = d.getHours(), min = d.getMinutes();
  return (m < 10 ? '0' + m : m) + '-' + (day < 10 ? '0' + day : day) + ' ' +
         (h < 10 ? '0' + h : h) + ':' + (min < 10 ? '0' + min : min);
}

function load_sessions(force) {
  sessionsLoadStartAt = Date.now();
  if (force || !sessionsProgressDoneOnce) {
    sessionsProgressValue = 0;
    paintSessionsProgress();
    startSessionsCreep(90);
  }
  $('#sessions_msg_div').hide();
  $('#sessions_div').hide();
  $.ajax({
    global: false,
    type: 'POST',
    url: API_BASE + 'sessions',
    timeout: 30000,
    success: function (ret) {
      if (ret.ret != 'success') {
        stopSessionsCreep();
        $('#sessions_progress_wrap').hide();
        $('#sessions_msg_div').show().text(ret.msg || '세션 목록을 불러오지 못했습니다.');
        return;
      }
      if (ret.refresh_min !== undefined && ret.refresh_min !== currentRefreshMin) {
        setupTimer(ret.refresh_min);
      }
      if (ret.relay_off) {
        finishSessionsProgress();
        $('#sessions_msg_div').hide();
        $('#sessions_div').html(
          '<div style="border:1px solid #bee5eb; background:#e8f6f8; border-radius:6px; padding:16px; text-align:center; color:#0c5460">' +
          '세션 목록은 Relay를 켜면 표시됩니다.<br>' +
          '<span style="font-size:13px">설정 &gt; Relay에서 켤 수 있습니다.</span>' +
          '</div>').show();
        return;
      }
      var list = ret.sessions || [];
      if (!list.length) {
        finishSessionsProgress();
        $('#sessions_msg_div').show().text('로그인 중인 세션이 없습니다.');
        return;
      }
      finishSessionsProgress();
      $('#sessions_msg_div').hide();
      var str = '<div style="font-size:12px; color:#888; margin-bottom:8px">로그인 중인 기기 ' + list.length + '개 · 마지막 활동 순</div>';
      str += '<div style="overflow-x:auto"><table class="table table-striped" style="font-size:13px"><thead><tr><th>사용자</th><th>기기</th><th>앱</th><th style="white-space:nowrap">마지막 활동</th><th style="white-space:nowrap">로그인</th></tr></thead><tbody>';
      for (var i = 0; i < list.length; i++) {
        var s = list[i];
        str += '<tr><td><strong>' + esc(s.user) + '</strong>' +
               (s.is_admin ? ' <span style="color:#888; font-size:12px">관리자</span>' : '') +
               (ret.current_id && s.id === ret.current_id ? ' <span style="display:inline-block; font-size:11px; padding:1px 7px; border-radius:10px; background:#e6f4ea; color:#137333">현재</span>' : '') +
               '</td><td>' + (s.device_name ? esc(s.device_name) : '<span style="color:#888">기기 정보 없음</span>') + '</td>' +
               '<td>' + esc(s.app_name || '-') + '</td>' +
               '<td style="white-space:nowrap">' + fmtTime(s.last_active_at) + '</td>' +
               '<td style="white-space:nowrap">' + fmtTime(s.created_at) + '</td></tr>';
      }
      str += '</tbody></table></div>';
      str += '<div style="font-size:12px; color:#888">· \'현재\'는 이 플러그인이 쓰는 세션입니다. · 세션은 shyni에 로그인할 때마다 생기고, 로그아웃할 때 지워집니다.</div>';
      $('#sessions_div').html(str).show();
    },
    error: function () {
      stopSessionsCreep();
      $('#sessions_progress_wrap').hide();
      $('#sessions_msg_div').show().text('세션 목록을 불러오지 못했습니다.');
    }
  });
}

$(document).ready(function() {
  $('#sessionsRefreshBtn').on('click', function() { load_sessions(true); });
  var initMin = parseInt("{{ arg['status_auto_refresh_min'] or '30' }}", 10);
  if (isNaN(initMin)) initMin = 1;
  currentRefreshMin = initMin;
  load_sessions();
  setupTimer(initMin);
});
</script>
{% endblock %}
